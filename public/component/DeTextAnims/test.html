<html>
  <head>
    <style>
      body
      {
        color: #fff;
        background-color: #000;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 20px 0;
        gap: 16px;
        width: 100%;
        xheight: 100%;
        font-family: sans-serif;
      }
      hr
      {
        border-color: #f00;
        width: 70%;
      }

      de-snake
      {
        stroke:none;
        fill:#fff;
        width:200px;
        height:200px;
        border:1px solid #ff0;
      }
      de-snake textPath
      {
        animation: detext-offset 100s infinite linear;
      }

      @keyframes detext-offset
      {
        from
        {
          startOffset: 0%;
        }
        to
        {
          startOffset: 100%;
        }
      }
    </style>

    <script src="detext.js" type="module"></script>
    <script type="module">
    </script>
  </head>

  <body>
    <h1>De-Snake</h1>
    <de-snake></de-snake>
    <de-snake
      anim-path="M0,90 Q90,90 90,45 Q90,10 50,10 Q10,10 10,40 Q10,70 45,70 Q70,70 90,100"
      start-offset="-50%"
      end-offset="55%"
      anim-duration="5s"
      style="width:400px;height:400px;"
    >
      Cambia lo superficial.
    </de-snake>

    <hr>
    <h1>De-Cursor-Reveal</h1>
    <de-cursor-reveal>
      Cambia lo superficial.
      Cambia también lo profundo.
      Cambia el modo de pensar.
      Cambia todo en este mundo.
      Cambia el clima con los años.
      Cambia el pastor su rebaño.
      Y así como todo cambia.
      Que yo cambie no es extraño.
    </de-cursor-reveal>

    <hr>
    <h1>De-Counter</h1>

  </body>
</html>

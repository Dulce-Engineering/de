<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>BlottoLog Logo - Pure SVG</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      margin: 0;
      flex-direction: column;
      overflow: hidden;
    }

    svg {
      border: 1px solid #f00;

      text {
        font-family: var(--font-heading);
        fill: var(--ink-brown-light);
        filter: drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.8));
      }
    }
  </style>
</head>

<body>

  <svg viewBox="0 0 1000 200" width="100%" height="100%">
    <defs>
      <path id="logo-curve" d="M 0 1000 Q 0 0 1000 0" />
    </defs>

    <!-- This visualizes the invisible curve the text sits on -->
    <use href="#logo-curve" fill="none" stroke="var(--terracotta-orange-light)" stroke-width="2" stroke-dasharray="10,5"
      opacity="0.5" />

    <text>
      <textPath href="#logo-curve" startOffset="68%" text-anchor="middle">
        <tspan font-size="180">B</tspan>
        <tspan font-size="165">l</tspan>
        <tspan font-size="150">o</tspan>
        <tspan font-size="135">t</tspan>
        <tspan font-size="120">t</tspan>
        <tspan font-size="105">o</tspan>
        <tspan font-size="90">l</tspan>
        <tspan font-size="75">o</tspan>
        <tspan font-size="60">g</tspan>
      </textPath>
    </text>
  </svg>

</body>

</html>

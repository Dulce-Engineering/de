<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blottolog - Captain's Log</title>
  <link rel="stylesheet" href="css/main.css">
  <meta name="theme-color" content="#EAC796">
</head>

<body>

  <header class="header">
    <button class="icon-button" aria-label="Profile">👤</button>
    <svg viewBox="300 350 400 250" width="100%" height="100%">
      <defs>
        <path id="logo-curve" d="M 0 1000 Q 0 500 1000 400" />
      </defs>
      <use href="#logo-curve" class="trace" />
      <rect x="300" y="350" width="400" height="250" class="viewbox" />
      <text>
        <textPath href="#logo-curve" startOffset="61%" text-anchor="middle">
          <tspan font-size="180">B</tspan>
          <tspan font-size="165">l</tspan>
          <tspan font-size="150">o</tspan>
          <tspan font-size="135">t</tspan>
          <tspan font-size="120">t</tspan>
          <tspan font-size="105">o</tspan>
          <tspan font-size="90">l</tspan>
          <tspan font-size="75">o</tspan>
          <tspan font-size="60">g</tspan>
        </textPath>
      </text>
    </svg>
    <button class="icon-button" aria-label="Target">🧭</button>
  </header>

  <main>
    <section id="timer-hero">
      <!-- The map map and ship marker -->
      <div class="course-plot-graphic">
        <!-- Map placeholder -->
      </div>

      <!-- Countdown formatted text -->
      <div class="countdown-timer-display">
        34:12
      </div>
    </section>

    <!-- 3. THE GRAPHIC MANIFEST -->
    <section id="manifest-container">
      <!-- Flex-wrapped text-less graphical icons will populate here dynamically -->
    </section>
  </main>

  <button class="floating-action-button" aria-label="Quick Add Drink">
    +
  </button>

</body>

</html>

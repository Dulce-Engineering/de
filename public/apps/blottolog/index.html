<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blottolog - Captain's Log</title>
  <link rel="stylesheet" href="css/main.css">
  <meta name="theme-color" content="#EAC796">

  <script type="module">
    import Utils from "../../lib/Utils.js";

    const drink_types =
    [
    ];

    Main();
    function Main()
    {
      select_drink_form.addEventListener('submit', On_Submit_Drink);
    }

    function On_Submit_Drink(e)
    {
      e.preventDefault();
      const button = e.submitter;
      if (button.classList.contains('drink-option'))
      {
        const icon = button.querySelector('.icon').innerText;
        const label = button.querySelector('.label').innerText;

        const html = `
          <li>
            <span class="icon">${icon}</span> 
            <span class="label">${label}</span> 
          </li>
        `;

        wip_drinks.appendChild(Utils.toElement(html));
        select_drink_dlg.hidePopover();
      }
    }
  </script>
</head>

<body>

  <header class="header">
    <button class="primary-button" aria-label="Profile">🫅</button>
    <svg viewBox="300 350 400 250" width="100%" height="100%">
      <defs>
        <path id="logo-curve" d="M 0 1000 Q 0 500 1000 400" />
      </defs>
      <use href="#logo-curve" class="trace" />
      <rect x="300" y="350" width="400" height="250" class="viewbox" />
      <text>
        <textPath href="#logo-curve" startOffset="61%" text-anchor="middle">
          <tspan font-size="180">B</tspan>
          <tspan font-size="165">l</tspan>
          <tspan font-size="150">o</tspan>
          <tspan font-size="135">t</tspan>
          <tspan font-size="120">t</tspan>
          <tspan font-size="105">o</tspan>
          <tspan font-size="90">l</tspan>
          <tspan font-size="75">o</tspan>
          <tspan font-size="60">g</tspan>
        </textPath>
      </text>
    </svg>
    <button class="primary-button" aria-label="Target">🤢</button>
  </header>

  <section class="timer">
    <div class="course-plot-graphic">
    </div>
    <div class="countdown-timer-display">
      34:12
    </div>
  </section>

  <section class="drinks">
    <ul id="wip_drinks">

    </ul>
    <ul id="finished-drinks">

    </ul>
    <button id="add_btn" class="action-button" popovertarget="select_drink_dlg">
      🍻
    </button>
    
    <dialog id="select_drink_dlg" popover>
      <form id="select_drink_form" method="dialog">
        <h2>Log New Cargo</h2>
        
        <div class="drink-category">
          <h3>Beer</h3>
          <div class="drink-options">
            <button type="submit" class="drink-option">
              <span class="icon">🍺</span>
              <span class="label">Middy 285ml</span>
            </button>
            <button type="submit" class="drink-option">
              <span class="icon" style="font-size: 1.4em;">🍺</span>
              <span class="label">Schooner 425ml</span>
            </button>
            <button type="submit" class="drink-option">
              <span class="icon" style="font-size: 1.8em;">🍺</span>
              <span class="label">Pint 570ml</span>
            </button>
          </div>
        </div>

        <div class="drink-category">
          <h3>Wine</h3>
          <div class="drink-options">
            <button type="submit" class="drink-option">
              <span class="icon">🍷</span>
              <span class="label">Small</span>
            </button>
            <button type="submit" class="drink-option">
              <span class="icon" style="font-size: 1.4em;">🍷</span>
              <span class="label">Regular</span>
            </button>
            <button type="submit" class="drink-option">
              <span class="icon" style="font-size: 1.8em;">🍷</span>
              <span class="label">Large</span>
            </button>
          </div>
        </div>

        <div class="drink-category">
          <h3>Spirits</h3>
          <div class="drink-options">
            <button type="submit" class="drink-option">
              <span class="icon">🥃</span>
              <span class="label">Half</span>
            </button>
            <button type="submit" class="drink-option">
              <span class="icon" style="font-size: 1.4em;">🥃</span>
              <span class="label">Single</span>
            </button>
            <button type="submit" class="drink-option">
              <span class="icon" style="font-size: 1.8em;">🥃</span>
              <span class="label">Double</span>
            </button>
          </div>
        </div>

        <div class="drink-category">
          <h3>Cocktail</h3>
          <div class="drink-options">
            <button type="submit" class="drink-option">
              <span class="icon">🍸</span>
              <span class="label">Short</span>
            </button>
            <button type="submit" class="drink-option">
              <span class="icon" style="font-size: 1.4em;">🍸</span>
              <span class="label">Regular</span>
            </button>
            <button type="submit" class="drink-option">
              <span class="icon" style="font-size: 1.8em;">🍸</span>
              <span class="label">Tall</span>
            </button>
          </div>
        </div>

        <div class="dialog-actions">
          <button type="button" class="secondary-button" popovertarget="select_drink_dlg" popovertargetaction="hide">
            ❌
          </button>
        </div>
      </form>
    </dialog>
  </section>

</body>

</html>

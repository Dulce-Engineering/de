<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blottolog - Captain's Log</title>
  <link rel="stylesheet" href="css/main.css">
  <meta name="theme-color" content="#EAC796">
</head>

<body>

  <header id="page-header">
    <button class="icon-button" aria-label="Profile">👤</button>
    <h1 class="logo-typography">BlottoLog</h1>
    <button class="icon-button" aria-label="Target">🧭</button>
  </header>

  <main>
    <section id="timer-hero">
      <!-- The map map and ship marker -->
      <div class="course-plot-graphic">
        <!-- Map placeholder -->
      </div>

      <!-- Countdown formatted text -->
      <div class="countdown-timer-display">
        34:12
      </div>
    </section>

    <!-- 3. THE GRAPHIC MANIFEST -->
    <section id="manifest-container">
      <!-- Flex-wrapped text-less graphical icons will populate here dynamically -->
    </section>
  </main>

  <button class="floating-action-button" aria-label="Quick Add Drink">
    +
  </button>

</body>

</html>

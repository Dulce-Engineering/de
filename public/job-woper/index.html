    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Website",
      "name": "Job Woper",
      "url": "https://dulceeng.com.au/job-woper",

    <script type="module">
      import Utils from "../lib/Utils.js";
      import "../component/DeDialogForm/index.js";
      import "../component/DeSelectTree/index.js";
      import "../component/DeLineChart/index.js";

      const storage_key = "jobwoper-charts";

      class Query
      {
        static async Select_All()
        {
          const res_http = await fetch("db/query.json");
          const queries = await res_http.json();
          // sort by order

          return queries;
        }
      }

      class Trend
      {
        static async Select_By_Query_Id(query_id)
        {
          const res_http = await fetch(`db/trend/query${query_id}.json`);
          const trends = await res_http.json();
          // sort by datetime

          return trends;
        }
      }

      Init();
      async function Init()
      {
        if ("serviceWorker" in navigator) 
        {
          //await navigator.serviceWorker.register("./lib/service-worker.js");
        }

        const observer = new MutationObserver(On_Mutation);
        On_Mutation.observer = observer;
        observer.observe(document.documentElement, { childList: true, subtree: false });
        
        function On_Mutation(mutations)
        {
          for (const mutation of mutations)
          {
            for (const node of mutation.addedNodes)
            {
              if (ads_elem && node.nodeType === 1 && node.nodeName == "IFRAME")
              {
                node.style.cssText = "width:100%;position:relative;border:none;";
                ads_elem.appendChild(node);

                console.log("iframe intercepted.");
              }
            }
          }
        }
      }

      Main();
      async function Main()
      {
        let queries = await Query.Select_All();
        queries = queries.filter(q => q.src == "seek" || q.src == undefined);
        queries.sort((a, b) => a.order - b.order);

        tech_select.items = queries;
        add_btn.addEventListener("click", On_Add_Btn_Click);

        const json_str = localStorage.getItem(storage_key);
        const charts = JSON.parse(json_str);
        Render_Charts(charts);
      }

      function Get_Charts()
      {
        const charts = [];

        const chart_elems = items.querySelectorAll("de-line-chart");
        for (const chart_elem of chart_elems)
        {
          charts.push(chart_elem.obj);
        }

        return charts;
      }

      // events =========================================================================

      async function On_Add_Btn_Click()
      {
        const new_chart = await chart_form.Show_Async();
        if (new_chart)
        {
          new_chart.id = crypto.randomUUID();

          await Render_Chart(new_chart);
          On_Change_Items();
          Update_Nav();
        }
      }
      
      function On_Change_Items()
      {
        const charts = Get_Charts();
        const json_str = JSON.stringify(charts);
        localStorage.setItem(storage_key, json_str);
      }

      // rendering ======================================================================

      function Render_Charts(charts)
      {
        items.replaceChildren();
        if (charts)
        {
          for (const chart of charts)
          {
            Render_Chart(chart);
          }
        }
      }

      async function Render_Chart(chart)
      {
        const queries = await Query.Select_All();
        const query = queries.find(q => q.id == chart.query_id);

        const html = `
          <de-line-chart title="${query.title}" x-label="Time" y-label="Usage">
            <button cid="tech_btn" slot="title" class="header small">
              <span class="text">Add Tech</span>
            </button>
            <button cid="del_btn" slot="title" class="header small">
              <span class="text">Delete</span>
            </button>
          </de-line-chart>
        `;
        const elements = Utils.toDocument(html);

        const del_btn = elements.querySelector("[cid=del_btn]");
        del_btn.addEventListener("click", (e) => On_Click_Del_File_Btn(e, chart_elem));

        const trends = await Trend.Select_By_Query_Id(chart.query_id);
        const data = trends.map(t => {return {x: t.datetime, y: t.count}});

        const chart_elem = elements.querySelector("de-line-chart");
        items.append(chart_elem);
        chart_elem.obj = chart;
        chart_elem.items = data;

        Render_Summary(chart_elem);

        return chart_elem;
      }

      function Render_Summary(chart_elem)
      {
        const html = `
          <table>
            <thead>
              <tr>
                <th></th>
                <th>Minimum</th>
                <th>Maximum</th>
                <th>Difference</th>
                <th>Average</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Time</td>
                <td cid="min_time"></td>
                <td cid="max_time"></td>
                <td cid="diff_time"></td>
                <td cid="avg_time"></td>
              </tr>
              <tr>
                <td>Usage</td>
                <td cid="min_usage"></td>
                <td cid="max_usage"></td>
                <td cid="diff_usage"></td>
                <td cid="avg_usage"></td>
              </tr>
            </tbody>
          </table>
        `;
        const elements = Utils.toDocument(html);

        chart_elem.append(elements);
      }

      function Update_Nav()
      {

      }
    </script>

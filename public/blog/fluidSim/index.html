    <style>
      body 
      {
        background: #000;
        color: white;
        font-family: 'Borel', cursive;
        font-size: 24px;
        padding: 0;
        margin: 24px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 20px;
      }

      header
      {
        display: flex;
        width: 100%;
      }
      header span
      {
        font-size: 2.5rem;
        width: 100%;
      }
      header div
      {
        display: flex;
        justify-content: flex-start;
        align-items: flex-start;
        gap: 10px;
      }
      header button
      {
        border: 8px solid rgb(134 155 183);
        border-radius: 100px;
        background-color: #fff;
        font-family: 'Borel', cursive;
        padding: 10px 10px 0 10px;
        vertical-align: middle;
        text-align: center;
        font-size: 1rem;
        cursor: pointer;
        transition: all 250ms;
        white-space: nowrap;
      }
      header button:hover
      {
        transform: scale(1.2);
      }
      header button:active
      {
        transform: scale(0.8);
      }

      fluid-canvas
      {
        display: inline-block;
        width: min(calc(100vw - 65px), calc(100vh - 148px));
        position: relative;
        font-size: 0;
        border: 10px solid rgb(134 155 183);
        border-radius: 10px;
        overflow: hidden;
        align-self: center;
      }
      fluid-canvas #canvas
      {
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      fluid-canvas #objs_canvas
      {
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
      }
      fluid-canvas #clock_canvas
      {
        width: 10%;
        position: absolute;
        top: 0;
        right: 0;
        pointer-events: none;
        margin: 10px;
        opacity: 0.5;
      }
      fluid-canvas #score_elem
      {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        font-size: 128px;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        padding: 64px 0 0 0;
        transform: scale(0) rotateZ(0deg);
        color: rgb(135 255 76);
      }
      fluid-canvas #score_elem.anim-zoom
      {
        animation-duration: 3s;
        animation-name: zoom;
        animation-iteration-count: 1;
      }
      fluid-canvas .msg
      {
        position: absolute;
        top: 0;
        left: 0;
        width: 84%;
        height: 84%;
        color: #000;
        font-size: 2.5vmin;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 8%;
        background-color: #fff;
        flex-direction: column;
        gap: 20px;

        img
        {
          width: 80%;
        }
      }
      fluid-canvas #cat_count
      {
        margin: 0 10px;
      }
      @keyframes zoom
      {
        from
        {
          transform: scale(0) rotateZ(0deg);
          opacity: 1;
        }
        to
        {
          transform: scale(10) rotateZ(400deg);
          opacity: 0;
        }
      }

      #ads_elem
      {
        height: 80px;
        overflow: hidden;
      }

    </style>

    <script type="module">
      Init();
      async function Init()
      {
        const observer = new MutationObserver(On_Mutation);
        On_Mutation.observer = observer;
        observer.observe(document.documentElement, { childList: true, subtree: false });
        
        function On_Mutation(mutations)
        {
          for (const mutation of mutations)
          {
            for (const node of mutation.addedNodes)
            {
              if (ads_elem && node.nodeType === 1 && node.nodeName == "IFRAME")
              {
                node.style.cssText = "width:100%;position:relative;border:none;";
                ads_elem.appendChild(node);

                console.log("iframe intercepted.");
              }
            }
          }
        }
      }
    </script>

    <div id="ads_elem"></div>

      <div>
        <button id="start_btn" hidden>Pause</button>
        <button id="reset_btn">New Game</button>
      </div>
    </header>

    <fluid-canvas id="fc" resolution="128"></fluid-canvas>

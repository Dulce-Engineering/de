<!doctype html> 
<html lang="en"> 

  <head> 
    <meta charset="UTF-8" />
    <title>Dragechon</title>
    <script src="//cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.js"></script>
    <style type="text/css">
        html
        {
          width: 100vw;
          height: 100vh;
        }
        body 
        {
          width: 100vw;
          height: 100vh;
          margin: 0;
          padding: 0;
          font-size: 0;
          background-color: #888;
          overflow: hidden;
        }
        canvas
        {
          xwidth: 100vw;
          xheight: 100vh;
          xdisplay: inline-block;
        }
    </style>
    <script type="module">

      var config = 
      {
        type: Phaser.AUTO,
        width: 1000, //window.innerWidth*3,
        height: 1000, //window.innerHeight*3,
        physics: 
        {
          default: 'arcade',
          arcade: { debug: false }
        },
        scene: 
        {
          preload: On_Scene_Preload,
          create: On_Scene_Create,
          update: On_Scene_Update
        },
        scale:
        {
          xwidth: 1000,
          xheight: 1000,
          mode: Phaser.Scale.ENVELOP,
          //mode: Phaser.Scale.FIT,
          autoCenter: Phaser.Scale.CENTER_BOTH
        }
      };

      var stars;
      var bombs;
      const start_pos = { x: config.width / 2, y: config.height / 2 };
      var game = new Phaser.Game(config);

      // window ===============================================================

      function On_Window_Tilt(event, scene)
      {
        if (event?.gamma) 
        {
          scene.ctx.deviceOrientationGamma = event.gamma;
        }
      }

      // scene ================================================================

      function On_Scene_Preload ()
      {
          this.load.image('sky', 'assets/sky.png');
          this.load.image('ground', 'assets/platform.png');
          this.load.image('star', 'assets/star.png');
          this.load.image('bomb', 'assets/bomb.png');
          //this.load.spritesheet('player', 'assets/player.png', { frameWidth: 32, frameHeight: 48 });
          this.load.spritesheet('player', 'assets/dragon-flying.png', { frameWidth: 290, frameHeight: 258 });
      }
      
      function On_Scene_Create ()
      {
        this.ctx = 
        {
          score: 0,
          player: null,
          gameOver: false,
          scoreText: null,
          cursors: null,
          deviceOrientationGamma: 0
        };

        const bk = this.add.tileSprite(0, 0, config.width, config.height, 'sky');
        bk.setOrigin(0, 0);
        //bk.setScrollFactor(0);

        // Create flying dragon animation
        this.anims.create({
          key: 'flying',
          frames: this.anims.generateFrameNumbers('player', { start: 0, end: 35 }),
          frameRate: 12,
          repeat: -1
        });

        this.ctx.scoreText = this.add.text(16, 16, 'score: 0', { fontSize: '32px', fill: '#000' });

        this.ctx.player = this.physics.add.sprite(start_pos.x, start_pos.y, 'player');
        this.ctx.player.play('flying');

        //platforms = this.physics.add.staticGroup();
        //platforms.create(400, 568, 'ground').setScale(2).refreshBody();
        //platforms.create(600, 400, 'ground');
        //platforms.create(50, 250, 'ground');
        //platforms.create(750, 220, 'ground');

        const star_settings = 
        {
          key: 'star', repeat: 50, active: true, visible: true, 
          collideWorldBounds: true
        }
        stars = this.physics.add.group(star_settings);

        // Place stars randomly within the world bounds
        Phaser.Actions.RandomRectangle(stars.getChildren(), new Phaser.Geom.Rectangle(0, 0, config.width, config.height));

        stars.children.iterate(function (star)
        {
          star.setBounce(1);

          // Give each star a random initial velocity
          const initialSpeed = Phaser.Math.Between(50, 150);
          const initialAngle = Phaser.Math.FloatBetween(0, 2 * Math.PI);
          this.physics.velocityFromRotation(initialAngle, initialSpeed, star.body.velocity);
        }, this);

        bombs = this.physics.add.group();

        //this.physics.add.collider(player, platforms);
        //this.physics.add.collider(stars, platforms);
        //this.physics.add.collider(bombs, platforms);
        this.physics.add.collider(this.ctx.player, bombs, On_Scene_Collide_Bomb, null, this);
        this.physics.add.overlap(this.ctx.player, stars, On_Scene_Overlap_Star, null, this);

        var camera = this.cameras.main;
        //camera.setSize(window.innerWidth, window.innerHeight);
        //camera.setViewport(0, 0, window.innerWidth, window.innerHeight);
        //camera.setZoom(2);
        camera.startFollow(this.ctx.player);

        // Keyboard input (arrow keys)
        this.ctx.cursors = this.input.keyboard.createCursorKeys();

        if (window.DeviceOrientationEvent) 
        {
          window.addEventListener('deviceorientation', (e) => On_Window_Tilt(e, this));
        }
      }

      function On_Scene_Update (time, delta)
      {
        if (this.ctx.gameOver)
        {
          return;
        }

        Player_Update(this.ctx, delta);

        const speed = 100;
        const direction = this.ctx.player.rotation - Math.PI / 2;
        this.physics.velocityFromRotation(direction, speed, this.ctx.player.body.velocity);

        this.cameras.main.rotation = -this.ctx.player.rotation;

        const MAX_SPEED = 150;
        const STEERING_FORCE = 0.05; // A small value (0 to 1) for gentle steering (lerp factor)
        const COHESION_WEIGHT = 1.1;   // How strongly stars are attracted to the center of their neighbors
        const ALIGNMENT_WEIGHT = 1.2;  // How strongly stars try to match the average velocity
        const SEPARATION_WEIGHT = 1.2; // How strongly stars try to avoid crowding. Usually the highest weight.
        const FLEE_WEIGHT = 1.0;       // How strongly stars flee from the player.
        const PLAYER_FLEE_RADIUS = 100;
        stars.getChildren().forEach(star => 
        {
          const neighbours = Get_Stars_In_Radius(star, 100);
          let desiredDirection = new Phaser.Math.Vector2(0, 0);

          const cohesion = Calculate_Cohesion_Vector(star, neighbours);
          desiredDirection.add(cohesion.normalize().scale(COHESION_WEIGHT));

          const alignment = Calculate_Alignment_Vector(neighbours);
          desiredDirection.add(alignment.normalize().scale(ALIGNMENT_WEIGHT));

          const separation = Calculate_Separation_Vector(star, neighbours);
          desiredDirection.add(separation.normalize().scale(SEPARATION_WEIGHT));

          const flee = Calculate_Flee_Vector_From_Player(star, this.ctx.player, PLAYER_FLEE_RADIUS);
          desiredDirection.add(flee.normalize().scale(FLEE_WEIGHT));

          if (desiredDirection.length() > 0)
          {
            const desiredVelocity = desiredDirection.normalize().scale(MAX_SPEED);
            star.body.velocity.lerp(desiredVelocity, STEERING_FORCE);
          }
        });
      }

      function On_Scene_Overlap_Star (player, star)
      {
        star.disableBody(true, true);

        //  Add and update the score
        this.ctx.score += 10;
        this.ctx.scoreText.setText('Score: ' + this.ctx.score);

        if (stars.countActive(true) === 0)
        {
          //  A new batch of stars to collect
          stars.children.iterate(function (child) {
            child.enableBody(true, child.x, 0, true, true);
          });

          var x = (player.x < 400) ? Phaser.Math.Between(400, 800) : Phaser.Math.Between(0, 400);

          var bomb = bombs.create(x, 16, 'bomb');
          bomb.setBounce(1);
          bomb.setCollideWorldBounds(true);
          bomb.setVelocity(Phaser.Math.Between(-200, 200), 20);
          bomb.allowGravity = false;
        }
      }

      function On_Scene_Collide_Bomb (player, bomb)
      {
        this.physics.pause();

        //player.setTint(0xff0000);
        //player.anims.play('turn');

        this.ctx.gameOver = true;
      }

      function Player_Update(ctx, delta)
      {
        // allow arrow-keys to rotate the player (left/right)
        const ROTATION_SPEED = 1.8; // base degrees per frame
        const cursors = ctx.cursors;
        if (cursors)
        {
          const frameScale = delta ? (delta / 16.6667) : 1;
          const rotationAmount = ROTATION_SPEED * frameScale;
          if (cursors.left.isDown)
          {
            ctx.player.angle -= rotationAmount;
          }
          else if (cursors.right.isDown)
          {
            ctx.player.angle += rotationAmount;
          }
        }

        // also respond to device tilt
        ctx.player.angle += ctx.deviceOrientationGamma/2;
      }

      function Get_Stars_In_Radius(centerStar, radius)
      {
        const nearbyStars = [];
        stars.getChildren().forEach(star => 
        {
          if (star !== centerStar) 
          {
            const distance = Phaser.Math.Distance.Between
              (centerStar.x, centerStar.y, star.x, star.y);
            if (distance <= radius) 
            {
              nearbyStars.push(star);
            }
          }
        });
        return nearbyStars;
      }

      /**
       * Calculates a vector pointing towards the average position of a group of neighbors.
       * This is the "cohesion" component of a flocking algorithm.
       * @param {Phaser.Physics.Arcade.Sprite} star The star to calculate the vector for.
       * @param {Phaser.Physics.Arcade.Sprite[]} neighbours An array of neighboring stars.
       * @returns {Phaser.Math.Vector2} A vector representing the direction towards the center of the neighbors.
       */
      function Calculate_Cohesion_Vector(star, neighbours)
      {
        if (neighbours.length === 0) {
          return new Phaser.Math.Vector2(0, 0); // Return a zero vector if no neighbors
        }

        // Calculate the average position (center of mass) of the neighbors
        let averageX = 0;
        let averageY = 0;
        neighbours.forEach(n => {
          averageX += n.x;
          averageY += n.y;
        });
        averageX /= neighbours.length;
        averageY /= neighbours.length;

        // Create a vector pointing from the current star to the center of mass.
        const cohesionVector = new Phaser.Math.Vector2(averageX - star.x, averageY - star.y);

        return cohesionVector;
      }

      /**
       * Calculates a vector representing the average heading of a group of neighbors.
       * This is the "alignment" component of a flocking algorithm.
       * @param {Phaser.Physics.Arcade.Sprite[]} neighbours An array of neighboring stars.
       * @returns {Phaser.Math.Vector2} A vector representing the average velocity of the neighbors.
       */
      function Calculate_Alignment_Vector(neighbours)
      {
        if (neighbours.length === 0) 
        {
          return new Phaser.Math.Vector2(0, 0); // Return a zero vector if no neighbors
        }

        // Calculate the average velocity of the neighbors
        const averageVector = new Phaser.Math.Vector2(0, 0);
        neighbours.forEach(n => 
        {
          averageVector.add(n.body.velocity);
        });

        return averageVector.scale(1 / neighbours.length);
      }

      /**
       * Calculates a repulsion vector to steer a star away from the player.
       * The force is inversely proportional to the distance, meaning it's very strong
       * when close and weak when far away.
       * @param {Phaser.Physics.Arcade.Sprite} star The star to calculate the vector for.
       * @param {Phaser.Physics.Arcade.Sprite} player The player object to flee from.
       * @param {number} fleeRadius The radius within which the star will start fleeing.
       * @returns {Phaser.Math.Vector2} A vector representing the repulsion force from the player.
       */
      function Calculate_Flee_Vector_From_Player(star, player, fleeRadius)
      {
        const fleeVector = new Phaser.Math.Vector2(0, 0);
        const distance = Phaser.Math.Distance.Between(star.x, star.y, player.x, player.y);

        if (distance > 0 && distance < fleeRadius) {
          // Calculate a vector pointing away from the player.
          const repulsionForce = new Phaser.Math.Vector2(star.x - player.x, star.y - player.y);
          // The force is inversely proportional to the distance. Closer player pushes harder.
          fleeVector.add(repulsionForce.normalize().scale(1 / distance));
        }

        return fleeVector;
      }

      /**
       * Calculates a vector to steer away from crowded neighbors.
       * This is the "separation" component of a flocking algorithm.
       * @param {Phaser.Physics.Arcade.Sprite} star The star to calculate the vector for.
       * @param {Phaser.Physics.Arcade.Sprite[]} neighbours An array of neighboring stars.
       * @returns {Phaser.Math.Vector2} A vector representing the direction to steer to avoid crowding.
       */
      function Calculate_Separation_Vector(star, neighbours)
      {
        const separationVector = new Phaser.Math.Vector2(0, 0);
        if (neighbours.length === 0) {
          return separationVector;
        }

        neighbours.forEach(n => {
          const distance = Phaser.Math.Distance.Between(star.x, star.y, n.x, n.y);
          
          if (distance > 0) {
            // Calculate a vector pointing away from the neighbor.
            const repulsionForce = new Phaser.Math.Vector2(star.x - n.x, star.y - n.y);
            // The force is inversely proportional to the distance. Closer neighbors push harder.
            separationVector.add(repulsionForce.normalize().scale(1 / distance));
          }
        });

        return separationVector;
      }
    </script>

  </body>

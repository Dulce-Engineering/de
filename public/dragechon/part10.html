<!doctype html> 
<html lang="en"> 

  <head> 
    <meta charset="UTF-8" />
    <title>Dragechon</title>
    <script src="//cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.js"></script>
    <style type="text/css">
        body 
        {
            margin: 0;
            padding: 0;
            font-size: 0;
        }
        canvas
        {
          xwidth: 100vw;
          xheight: 100vh;
          xdisplay: inline-block;
        }
    </style>
    <script type="module">

      var config = 
      {
        type: Phaser.AUTO,
        width: 1000, //window.innerWidth*3,
        height: 1000, //window.innerHeight*3,
        physics: 
        {
          default: 'arcade',
          arcade: { debug: false }
        },
        scene: 
        {
          preload: On_Preload,
          create: On_Create,
          update: On_Update
        },
        scale:
        {
          width: window.innerWidth,
          height: window.innerHeight,
          xmode: Phaser.Scale.FIT,
          xautoCenter: Phaser.Scale.CENTER_BOTH
        }
      };

      var player;
      var stars;
      var bombs;
      //var platforms;
      var score = 0;
      var gameOver = false;
      var scoreText;
      let deviceOrientationGamma = 0;
      const start_pos = { x: config.width / 2, y: config.height / 2 };
      var game = new Phaser.Game(config);

      function On_Preload ()
      {
          this.load.image('sky', 'assets/sky.png');
          this.load.image('ground', 'assets/platform.png');
          this.load.image('star', 'assets/star.png');
          this.load.image('bomb', 'assets/bomb.png');
          this.load.spritesheet('dude', 'assets/dude.png', { frameWidth: 32, frameHeight: 48 });
      }

      function On_Create ()
      {
        const bk = this.add.tileSprite(0, 0, config.width, config.height, 'sky');
        bk.setOrigin(0, 0);
        //bk.setScrollFactor(0);

        this.anims.create({
          key: 'left',
          frames: this.anims.generateFrameNumbers('dude', { start: 0, end: 3 }),
          frameRate: 10,
          repeat: -1
        });
        this.anims.create({
          key: 'turn',
          frames: [ { key: 'dude', frame: 4 } ],
          frameRate: 20
        });
        this.anims.create({
          key: 'right',
          frames: this.anims.generateFrameNumbers('dude', { start: 5, end: 8 }),
          frameRate: 10,
          repeat: -1
        });

        scoreText = this.add.text(16, 16, 'score: 0', { fontSize: '32px', fill: '#000' });

        player = this.physics.add.sprite(start_pos.x, start_pos.y, 'dude');

        //platforms = this.physics.add.staticGroup();
        //platforms.create(400, 568, 'ground').setScale(2).refreshBody();
        //platforms.create(600, 400, 'ground');
        //platforms.create(50, 250, 'ground');
        //platforms.create(750, 220, 'ground');

        const star_settings = 
        {
          key: 'star', repeat: 10, active: true, visible: true, collideWorldBounds: true
        }
        stars = this.physics.add.group(star_settings);
        const radius = 200;
        const starChildren = stars.getChildren();
        const angleStep = (2 * Math.PI) / starChildren.length;
        for (let i = 0; i < starChildren.length; i++)
        {
          const star = starChildren[i];

          const angle = i * angleStep;
          const x = start_pos.x + radius * Math.cos(angle);
          const y = start_pos.y + radius * Math.sin(angle);
          star.setPosition(x, y);
          star.setBounce(1);

          const velocityRotation = 
            Phaser.Math.Angle.Between(start_pos.x, start_pos.y, star.x, star.y);
          this.physics.velocityFromRotation(velocityRotation, 100, star.body.velocity);
        }

        bombs = this.physics.add.group();

        //this.physics.add.collider(player, platforms);
        //this.physics.add.collider(stars, platforms);
        //this.physics.add.collider(bombs, platforms);
        this.physics.add.collider(player, bombs, On_Collide_Bomb, null, this);
        this.physics.add.overlap(player, stars, On_Overlap_Star, null, this);

        var camera = this.cameras.main;
        //camera.setSize(window.innerWidth, window.innerHeight);
        //camera.setViewport(0, 0, window.innerWidth, window.innerHeight);
        camera.setZoom(3);
        camera.startFollow(player);

        if (window.DeviceOrientationEvent) 
        {
          window.addEventListener('deviceorientation', On_Tilt);
        }
      }

      function On_Tilt()
      {
        if (event.gamma !== null) 
        {
          deviceOrientationGamma = event.gamma;
        }
      }

      function On_Update ()
      {
          if (gameOver)
          {
              return;
          }

          player.angle += deviceOrientationGamma/2;

          const speed = 100;
          const direction = player.rotation - Math.PI / 2;
          this.physics.velocityFromRotation(direction, speed, player.body.velocity);

          this.cameras.main.rotation = -player.rotation;
      }

      function On_Overlap_Star (player, star)
      {
        star.disableBody(true, true);

        //  Add and update the score
        score += 10;
        scoreText.setText('Score: ' + score);

        if (stars.countActive(true) === 0)
        {
          //  A new batch of stars to collect
          stars.children.iterate(function (child) {
            child.enableBody(true, child.x, 0, true, true);
          });

          var x = (player.x < 400) ? Phaser.Math.Between(400, 800) : Phaser.Math.Between(0, 400);

          var bomb = bombs.create(x, 16, 'bomb');
          bomb.setBounce(1);
          bomb.setCollideWorldBounds(true);
          bomb.setVelocity(Phaser.Math.Between(-200, 200), 20);
          bomb.allowGravity = false;
        }
      }

      function On_Collide_Bomb (player, bomb)
      {
          this.physics.pause();

          player.setTint(0xff0000);

          player.anims.play('turn');

          gameOver = true;
      }
    </script>
  </head>

  <body>
  </body>

</html>

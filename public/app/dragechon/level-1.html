<!doctype html> 
<html lang="en"> 

  <head> 
    <meta charset="UTF-8" />
    <title>Dragechon</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <script src="//cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.js"></script>
    <style type="text/css">
        html
        {
          width: 100vw;
          height: 100vh;
        }
        body 
        {
          width: 100vw;
          height: 100vh;
          margin: 0;
          padding: 0;
          font-size: 0;
          background-color: #888;
          overflow: hidden;
        }
        canvas
        {
          xwidth: 100vw;
          xheight: 100vh;
          xdisplay: inline-block;
        }
    </style>
    <script type="module">
      import Player from './lib/Player.js';
      import Background from './lib/Background.js';
      import Camera from './lib/Camera.js';
      import Input from './lib/Input.js';
      import Home from './lib/Home.js';

      class Level_1 extends Phaser.Scene
      {
        preload()
        {
          this.load.image('mountain', 'assets/mountain.png');
          this.load.image('bk', 'assets/grid.png');
          this.load.image('ground', 'assets/platform.png');
          this.load.image('star', 'assets/pig.png');
          this.load.image('bomb', 'assets/bomb.png');
          this.load.image('home', 'assets/mountain.png');

          const sprite_spec = { frameWidth: 290, frameHeight: 258 };
          this.load.spritesheet('player', 'assets/dragon/flying.png', sprite_spec);
        }
        
        create()
        {
          this.game.ctx = 
          {
            player: null,
            gameOver: false,
            camera: null,
            input: null,
          };

          this.game.ctx.player = Player.New(this);
          this.game.ctx.camera = Camera.New(this);
          this.game.ctx.input = new Input(this, window);

          new Home(this, 200, 200, this.game.ctx.player);
          new Background(this, this.game.ctx.player);

          this.physics.world.setBounds
            (0, 0, this.game.config.width, this.game.config.height);
        }

        update(time, delta)
        {
          this.game.ctx.player.Update(this, delta);
          this.game.ctx.camera.Update(this, delta);
        }

        Game_Over()
        {
          this.physics.pause();
          this.scene.pause();
          this.game.destroy(true);        
        }
      }

      Main();
      function Main()
      {
        const WORLD_WIDTH = 1000;
        const WORLD_HEIGHT = 1000;
        var config = 
        {
          type: Phaser.AUTO,
          width: WORLD_WIDTH,
          height: WORLD_HEIGHT,
          physics: 
          {
            default: 'arcade',
            arcade: { debug: false }
          },
          scene: Level_1,
          scale:
          {
            mode: Phaser.Scale.ENVELOP,
            autoCenter: Phaser.Scale.CENTER_BOTH,
          }
        };

        var game = new Phaser.Game(config);
      }
    </script>
  </head>

  <body>
  </body>

</html>

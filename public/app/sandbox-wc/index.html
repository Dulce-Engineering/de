<!doctype html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Components Sandbox</title>
    <link rel="stylesheet" href="./index.css">

    <script type="module">
      import "./de-task-list.js";
      import { getTaskList } from "./task-list-data.min.js";

      Main();
      async function Main()
      {
        const items = await getTaskList();
        if (items)
        {
          items.sort((a, b) => a.priority - b.priority);
          task_list_elem.items = items;
        }
      }
    </script>
  </head>

  <body>
    <de-task-list id="task_list_elem"></de-task-list>
  </body>

</html>

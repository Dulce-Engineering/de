<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&amp;family=Share+Tech+Mono&amp;display=swap');
      
      .bg { fill: #1a1512; }
      .card-border { fill: none; stroke: #c59b27; stroke-width: 2; rx: 8; }
      .divider { stroke: #4a3b2c; stroke-width: 1; }
      .title-label { font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 24px; fill: #c59b27; }
      .badge-bg { fill: rgba(217, 107, 39, 0.15); stroke: rgba(217, 107, 39, 0.4); stroke-width: 1; rx: 4; }
      .badge-text { font-family: 'Share Tech Mono', monospace; font-size: 11px; fill: #d96b27; letter-spacing: 1px; }
      .sample-title { font-family: 'Source Serif 4', serif; font-size: 21px; font-weight: 600; fill: #e6d5b8; }
      .sample-alphabet { font-family: 'Source Serif 4', serif; font-size: 15px; fill: #8c7a6b; }
      .context-box { fill: #14110f; stroke: #4a3b2c; stroke-width: 1; stroke-dasharray: 4 2; rx: 4; }
      .context-label { font-family: 'Share Tech Mono', monospace; font-size: 10px; fill: #8c7a6b; letter-spacing: 1px; }
      .context-text { font-family: 'Source Serif 4', serif; font-size: 15px; line-height: 22px; fill: #e6d5b8; }
    </style>
  </defs>

  <rect x="2" y="2" width="796" height="316" rx="8" class="bg"/>
  <rect x="2" y="2" width="796" height="316" rx="8" class="card-border"/>

  <text x="28" y="42" class="title-label">Source Serif 4</text>
  <rect x="520" y="24" width="250" height="24" class="badge-bg"/>
  <text x="645" y="40" text-anchor="middle" class="badge-text">CLASSIC EDITORIAL SERIF</text>
  
  <line x1="28" y1="58" x2="772" y2="58" class="divider"/>

  <text x="28" y="96" class="sample-title">Classic Editorial Precision &amp; Harmonious Proportions</text>

  <text x="28" y="130" class="sample-alphabet">ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz</text>
  <text x="28" y="152" class="sample-alphabet" font-style="italic">Italic: Crafted for structured hierarchy across mobile and desktop devices.</text>

  <rect x="28" y="174" width="744" height="116" class="context-box"/>
  <text x="44" y="200" class="context-label">CONTEXTUAL USAGE • EVENT LISTINGS &amp; SETTINGS MODAL</text>
  <text x="44" y="228" class="context-text">Combines traditional French and British typography heritage with clean optical size</text>
  <text x="44" y="252" class="context-text">scaling suitable for dense multi-field event creation dialogues.</text>
</svg>

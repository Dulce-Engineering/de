<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&amp;family=EB+Garamond:ital,wght@0,400;0,600;1,400&amp;family=Share+Tech+Mono&amp;display=swap');
      
      .card-bg { fill: #1c1612; }
      .card-frame { fill: none; stroke: #c59b27; stroke-width: 2.5; rx: 8; }
      .inner-frame { fill: none; stroke: rgba(197, 155, 39, 0.3); stroke-width: 1; rx: 6; }
      .header-title { font-family: 'Cinzel Decorative', Georgia, serif; font-size: 20px; font-weight: 700; fill: #c59b27; }
      .header-sub { font-family: 'EB Garamond', Georgia, serif; font-size: 14px; font-style: italic; fill: #8c7a6b; }
      .divider { stroke: #4a3b2c; stroke-width: 1; }
      
      .demo-box { fill: #14110f; stroke: #4a3b2c; stroke-width: 1; rx: 6; }
      .demo-app-title { font-family: 'Cinzel Decorative', Georgia, serif; font-size: 24px; font-weight: 700; fill: #c59b27; letter-spacing: 2px; }
      .demo-body { font-family: 'EB Garamond', Georgia, serif; font-size: 16px; line-height: 24px; fill: #e6d5b8; }
      .demo-gauge-box { fill: #221a14; stroke: #4a3b2c; stroke-width: 1; rx: 4; }
      .demo-timer-val { font-family: 'Share Tech Mono', monospace; font-size: 22px; font-weight: bold; fill: #d96b27; letter-spacing: 1px; }
      .demo-timer-lbl { font-family: 'Share Tech Mono', monospace; font-size: 11px; fill: #8c7a6b; text-transform: uppercase; letter-spacing: 1px; }
      .badge-role { font-family: 'Share Tech Mono', monospace; font-size: 11px; fill: #d96b27; }
    </style>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="836" height="396" rx="8" class="card-bg"/>
  <rect x="2" y="2" width="836" height="396" rx="8" class="card-frame"/>
  <rect x="8" y="8" width="824" height="384" rx="6" class="inner-frame"/>

  <!-- Card Header -->
  <text x="32" y="42" class="header-title">Option A: The "Instrument Dial &amp; Chronicle" (Recommended)</text>
  <text x="32" y="64" class="header-sub">Cinzel Decorative (Headings) • EB Garamond (Body) • Share Tech Mono (Timers &amp; Gauges)</text>
  <line x1="32" y1="76" x2="808" y2="76" class="divider"/>

  <!-- Simulated Live UI Component -->
  <rect x="32" y="92" width="776" height="280" rx="6" class="demo-box"/>

  <text x="420" y="132" text-anchor="middle" class="demo-app-title">TEMPUSTOI • CHRONOMETRIC REGULATOR</text>
  <line x1="160" y1="146" x2="680" y2="146" stroke="#c59b27" stroke-width="1" opacity="0.5"/>

  <text x="56" y="180" class="demo-body">"The Time Traveller was pointing at a delicate mechanism of ivory and brass. 'This little dial',</text>
  <text x="56" y="204" class="demo-body">he explained, 'measures intervals across the temporal continuum with absolute precision.'"</text>

  <!-- Timer Dials Row -->
  <g transform="translate(56, 230)">
    <!-- Timer 1 -->
    <rect x="0" y="0" width="345" height="110" rx="4" class="demo-gauge-box"/>
    <text x="172" y="32" text-anchor="middle" class="demo-timer-lbl">PRODUCT RELEASE MILESTONE</text>
    <text x="172" y="68" text-anchor="middle" class="demo-timer-val">03d : 14h : 22m : 45s</text>
    <text x="172" y="94" text-anchor="middle" class="badge-role">FONT: SHARE TECH MONO</text>

    <!-- Timer 2 -->
    <rect x="375" y="0" width="345" height="110" rx="4" class="demo-gauge-box"/>
    <text x="547" y="32" text-anchor="middle" class="demo-timer-lbl">FOCUS SPRINT (RECURRING)</text>
    <text x="547" y="68" text-anchor="middle" class="demo-timer-val" fill="#c59b27">00d : 00h : 24m : 18s</text>
    <text x="547" y="94" text-anchor="middle" class="badge-role" fill="#c59b27">ACTIVE COUNTDOWN GAUGE</text>
  </g>
</svg>

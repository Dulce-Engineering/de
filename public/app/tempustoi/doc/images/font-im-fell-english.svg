<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&amp;family=Share+Tech+Mono&amp;display=swap');
      
      .bg { fill: #1a1512; }
      .card-border { fill: none; stroke: #c59b27; stroke-width: 2; rx: 8; }
      .divider { stroke: #4a3b2c; stroke-width: 1; }
      .title-label { font-family: 'IM Fell English', serif; font-size: 24px; fill: #c59b27; }
      .badge-bg { fill: rgba(217, 107, 39, 0.15); stroke: rgba(217, 107, 39, 0.4); stroke-width: 1; rx: 4; }
      .badge-text { font-family: 'Share Tech Mono', monospace; font-size: 11px; fill: #d96b27; letter-spacing: 1px; }
      .sample-title { font-family: 'IM Fell English', serif; font-size: 22px; fill: #e6d5b8; }
      .sample-alphabet { font-family: 'IM Fell English', serif; font-size: 15px; fill: #8c7a6b; }
      .context-box { fill: #14110f; stroke: #4a3b2c; stroke-width: 1; stroke-dasharray: 4 2; rx: 4; }
      .context-label { font-family: 'Share Tech Mono', monospace; font-size: 10px; fill: #8c7a6b; letter-spacing: 1px; }
      .context-text { font-family: 'IM Fell English', serif; font-size: 15px; line-height: 22px; fill: #e6d5b8; }
    </style>
  </defs>

  <rect x="2" y="2" width="796" height="316" rx="8" class="bg"/>
  <rect x="2" y="2" width="796" height="316" rx="8" class="card-border"/>

  <text x="28" y="42" class="title-label">IM Fell English</text>
  <rect x="520" y="24" width="250" height="24" class="badge-bg"/>
  <text x="645" y="40" text-anchor="middle" class="badge-text">HISTORIC LETTERPRESS IMPRINT</text>
  
  <line x1="28" y1="58" x2="772" y2="58" class="divider"/>

  <text x="28" y="96" class="sample-title">An Authentic 19th-Century Letterpress Imprint</text>

  <text x="28" y="130" class="sample-alphabet">ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz</text>
  <text x="28" y="152" class="sample-alphabet" font-style="italic">Italic: Registered at Stationers’ Hall, London, anno Domini 1895.</text>

  <rect x="28" y="174" width="744" height="116" class="context-box"/>
  <text x="44" y="200" class="context-label">CONTEXTUAL USAGE • HISTORICAL NARRATIVE &amp; THEMED NOTES</text>
  <text x="44" y="228" class="context-text">"Scientific people know very well that Time is only a kind of Space. We can move along</text>
  <text x="44" y="252" class="context-text">it just as we move about in other dimensions with the aid of suitable mechanical engines."</text>
</svg>

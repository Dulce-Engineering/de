<!doctype html>
<html lang="en">

<head>
  <script async src="/lib/ga.js"></script>
  <link rel="manifest" href="/app/jopr/manifest.json">
  <title>JOPR: CV</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="Free local-first job tracker & AI CV builder. Track applications, customize resumes, and manage contacts securely from your browser with no signups required.">
  <meta name="keywords" content="job tracker, job application tracker, AI resume builder, AI CV generator, local-first app, private job tracker, custom CV, tailored cover letters, resume editor, career manager, retro terminal, no signup job tracker, client-side resume builder, PWA job tracker">
  <meta name="author" content="Dulce Engineering Pty. Ltd.">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="JOPR">
  <meta property="og:description" content="Free local-first job tracker & AI CV builder. Track applications, customize resumes, and manage contacts securely from your browser with no signups required.">
  <meta property="og:image" content="https://dulceeng.com.au/app/jopr/image/screenshot-landscape.png">
  <meta property="og:url" content="https://dulceeng.com.au/app/jopr">
  <meta property="og:type" content="website">
  <link rel="shortcut icon" href="../image/favicon.ico">

  <link rel="stylesheet" href="../component/de-info/style.css?v=2">
  <link rel="stylesheet" href="../component/de-edit-text/style.css?v=2">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Website",
    "name": "JOPR",
    "url": "https://dulceeng.com.au/app/jopr",
    "description": "Free local-first job tracker & AI CV builder. Track applications, customize resumes, and manage contacts securely from your browser with no signups required.",
    "image": "https://dulceeng.com.au/app/jopr/image/screenshot-landscape.png"
  }
  </script>
  <script type="importmap">
  {
    "imports": 
    {
      "firebase/app":       "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/functions": "https://www.gstatic.com/firebasejs/12.12.1/firebase-functions.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js",
      "firebase/auth":      "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase-analytics": "https://www.gstatic.com/firebasejs/12.12.1/firebase-analytics.js",
      "firebase/ai":        "https://www.gstatic.com/firebasejs/12.12.1/firebase-ai.js"
    }
  }
  </script>
  <script type="module">
    import "/dedial/dedial.js?v=2";
    import "/component/DeInputList/index3.js?v=2";
    import "/component/DeForm/index.js?v=2";
    import "/component/DeDialogForm/index.js?v=2";
    import "/component/DeDialogAlert/index.js?v=2";
    import "/component/DeDialogConfirm/index.js?v=2";
    import "../component/de-toolbar-menu/index.js?v=2";
    import "../component/de-info/index.js?v=2";
    import "../component/de-edit-text/index.js?v=2";
  </script>
  <script src="./gen-cv.js?v=2" type="module"></script>

  <style>
    @font-face 
    {
      font-family: roboto;
      src: url("../font/Roboto/Roboto-VariableFont_wdth-wght.ttf");
    }
    @font-face 
    {
      font-family: roboto-condensed;
      src: url("../font/Roboto_Condensed/RobotoCondensed-VariableFont_wght.ttf");
    }
    @font-face 
    {
      font-family: fleur-de-leah;
      src: url("../font/Fleur_De_leah/FleurDeLeah-Regular.ttf");
    }
    @font-face 
    {
      font-family: mea-culpa;
      src: url("../font/Mea_Culpa/MeaCulpa-Regular.ttf");
    }
    @font-face 
    {
      font-family: arvo;
      src: url("../font/Arvo/Arvo-Regular.ttf");
    }
    @font-face 
    {
      font-family: fugaz-one;
      src: url("../font/Fugaz_One/FugazOne-Regular.ttf");
    }
    @font-face 
    {
      font-family: miss-fajardose;
      src: url("../font/Miss_Fajardose/MissFajardose-Regular.ttf");
    }
    @font-face 
    {
      font-family: playfair-display;
      src: url("../font/Playfair_Display/PlayfairDisplay-VariableFont_wght.ttf");
    }
    @font-face 
    {
      font-family: monoton;
      src: url("../font/Monoton/Monoton-Regular.ttf");
    }

    :root 
    {
      background-color: #fff;
      font-family: roboto;
      font-size: 14px;
    }
    body 
    {
      display: grid;
      grid-template-columns: 5fr 4fr;
      grid-template-areas: 
        "personal skills"
        "experience experience"
        "projects projects";
      min-height: 100vh;
      margin: 0;
      transition: opacity 0.5s ease-in-out;
      opacity: 0;
    }
    @media screen
    {
      body
      {
        padding: 80px;
        gap: 30px 60px;
      }
      h1
      {
        font-size: 5rem;
        line-height: 5.5rem;
      }
    }
    @media print
    {
      body
      {
        padding: 30px 10px 0 10px;
        gap: 30px;
      }
      h1
      {
        font-size: 4rem;
        line-height: 4.5rem;
      }
    }

    #about, #tech_skills
    {
      margin: 20px 0 0 0;
    }
    #personal
    {
      grid-area: personal;
    }
    #skills
    {
      grid-area: skills;

      [cid="edu_title"]
      {
        margin: 0;
      }
      [cid="edu_institution"]
      {
        margin: 0 0 10px 0;
      }
    }
    #experience
    {
      grid-area: experience;
    }
    #projects_article
    {
      grid-area: projects;

      main[cid="items_elem"]
      {
        font-family: roboto-condensed;
        gap: 20px;
      }
      div.no-break
      {
        padding: 0;
      }
    }

    article
    {
      display: flex;
      flex-direction: column;
      gap: 10px;
      xalign-items: center;
      align-items: stretch;

      &.compact
      {
        flex-direction: row;
      }
    }
    dl
    {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-block-start: 0;
      margin-block-end: 0;
    }
    dt
    {
      display: inline-block;
    }
    dd
    {
      display: inline-block;
      margin: 0;
      margin-inline-start: 0;
    }
    h1
    {
      margin-block-start: 0;
      margin-block-end: 0;
      margin-inline-start: 0;
      margin-inline-end: 0;
      xfont-weight: bold;
      font-weight: normal;
      xfont-family: fugaz-one;
      xfont-family: playfair-display;
      font-family: monoton;
      color: #f00;
    }
    h2
    {
      font-size: 1.8rem;
      font-family: roboto-condensed;
      font-weight: bold;
      margin-block-start: 0;
      margin-block-end: 0;
      margin-inline-start: 0;
      margin-inline-end: 0;
      padding: 5px 10px 5px 10px;
      margin: 0;
      background-color: #f00;
      color: #fff;
      border-radius: 0 15px;
      opacity: 0.7;
    }
    h3, .h3
    {
      font-size: 1.6rem;
      margin-block-start: 0;
      margin-block-end: 0;
      margin-inline-start: 0;
      margin-inline-end: 0;
      font-weight: normal;
      margin: 0 0 6px 0;
    }
    ul
    {
      display: flex;
      flex-direction: column;
      gap: 10px;
      list-style-type: disc;
      margin-block-start: 0;
      margin-block-end: 0;
      padding-inline-start: 20px;
    }
    #skills_value ul
    {
      display: block;
      column-count: 2;
      column-gap: 20px;
    }
    p
    {
      line-height: 1.4rem;
      display: block;
      margin-block-start: 0;
      margin-block-end: 0;
      margin-inline-start: 0;
      margin-inline-end: 0;
    }
    footer
    {
      display: block;
      font-size: 1.2rem;
      opacity: 0.6;
      margin: 0;
      padding: 0;
    }
    de-input-list
    {
      main
      {
        display: flex;
        flex-direction: column;
        xgap: 30px;
      }
      footer
      {
        font-family: roboto-condensed;
        font-size: 1rem;
      }
    }
    de-info
    {
      [cid=info_elem]
      {
        color: #000;
        background-color: #fffe;
        padding: 10px 20px;
      }
    }

    .no-break:not(:first-child)
    {
      break-inside: avoid;
      margin: 30px 0 0 0;
    }
    .separate
    {
      margin: 10px 0 0 0;
    }
    .subheading
    {
      display: inline-block;
      font-size: 1.2rem;
      opacity: 0.6;
      margin: 0 0 5px 0;
    }
    .highlight
    {
      font-weight: bold;
      font-size: 1.2rem;
    }
    .coloured
    {
      xbackground-color: #44a;
      xcolor: #fff;

      de-input-list main
      {
        gap: 30px;
      }
      de-input-list main, dl
      {
        margin: 0 20px 0 0;
      }
    }
    .sidebar
    {
      width: 30%;
      display: flex;
      flex-direction: column;
      gap: 40px;
      margin: 40px 0 40px 30px;
      padding: 0 30px 0 0;
      border-right: 1px solid #000;
    }
    .main
    {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 40px;
      padding: 40px 30px 40px 30px;

      h2
      {
        border-bottom: 1px solid #000;
      }
    }
    .project-tech
    {
      display: none;
    }

    #summ_value
    {
      font-family: roboto-condensed;
    }
    #jobs_list
    {
      main 
      {
        & > div:not(:first-child)
        {
          border-top: #f008 2px solid;
          padding: 10px 0 0 0;
        }
        div
        {
          p, div
          {
            font-family: roboto-condensed;
          }
        }
        div.legacy + div.legacy
        {
          xpadding: 0;
        }

        [cid="legacy_tech"]
        {
          display: block;
        }
      }
    }
    #projects_article
    {
      h3
      {
        display: inline-block;
        margin: 0;
      }
      p
      {
        margin: 0;
      }
      .no-break:not(:first-child) 
      {
        margin: 0;
      }
    }
  </style>

</head>

<body>

  <section id="personal">
    <header><h1 id="prof_name"></h1></header>
    <article class="compact">
      <dl id="prof_email_field">
        <dt><img src="../image/black/mail.svg"></dt>
        <dd></dd>
      </dl>
      <dl id="prof_phone_field">
        <dt><img src="../image/black/call.svg"></dt>
        <dd></dd>
      </dl>
      <dl id="prof_ref_field">
        <dt><img src="../image/black/info.svg"></dt>
        <dd></dd>
      </dl>
    </article>
    <article class="compact">
      <dl id="prof_address_field">
        <dt><img src="../image/black/home.svg"></dt>
        <dd></dd>
      </dl>
      <dl id="prof_residency_field">
        <dt><img src="../image/black/passport.svg"></dt>
        <dd></dd>
      </dl>
    </article>
    <article class="compact">
      <dl id="prof_website_field">
        <dt><img src="../image/black/website.svg"></dt>
        <dd></dd>
      </dl>
      <dl id="prof_links_field">
        <dt><img src="../image/black/link.svg"></dt>
        <dd id="prof_links_value"></dd>
      </dl>
    </article>
    <!-- summary -->
    <article id="about">
      <h2>About Me</h2>
      <de-edit-text id="summ_value" input-type="textarea"></de-edit-text>
    </article>
  </section>

  <section id="skills">
    <!-- education -->
    <article>
      <h2>Education</h2>
      <de-input-list id="education_list">
        <div slot="item">
          <h3 cid="edu_title"></h3>
          <div cid="edu_institution" class="highlight"></div>
        </div>
      </de-input-list>
    </article>
    <!-- skills -->
    <article id="tech_skills">
      <h2>Technical Skills</h2>
      <div id="skills_value"></div>
    </article>
  </section>

  <!-- experience -->
  <article id="experience">
    <h2>Work Experience</h2>
    <de-input-list id="jobs_list">
      <div slot="item" class="no-break">
        <div cid="best_job">
          <span class="subheading" cid="job_company"></span> | 
          <span class="subheading" cid="dates"></span>
          <de-edit-text cid="job_title" class="h3"></de-edit-text>
          <de-edit-text cid="job_description" input-type="textarea"></de-edit-text>
          <div class="separate" cid="job_points"></div>
          <div class="separate">Tech: <span cid="job_tech"></span></div>
        </div>
        <div cid="legacy_job">
          <span class="subheading" cid="legacy_job_title"></span> |
          <span class="subheading" cid="legacy_job_company"></span> |
          <span class="subheading" cid="legacy_dates"></span>
          <span class="" cid="legacy_tech"></span>
        </div>
      </div>
      <footer slot="footer" class="no-break">*Role details and legacy jobs available on request.</footer>
    </de-input-list>
  </article>

  <!-- projects -->
  <article id="projects_article" style="display:none;">
    <h2>Personal Projects</h2>
    <de-input-list id="projects_list">
      <div slot="item" class="no-break">
        <h3 cid="project_title"></h3> - 
        <a cid="project_url" target="blank"></a><br>
        <p class="separate" cid="project_description"></p>
        <p class="separate project-tech">Tech: <span class="" cid="project_tech"></span></p>
      </div>
    </de-input-list>
  </article>

  <de-info id="info_elem"></de-info>

</body>

</html>

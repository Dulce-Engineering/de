  <script type="importmap">
  {
    "imports": 
    {
      "firebase/app":       "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/functions": "https://www.gstatic.com/firebasejs/12.12.1/firebase-functions.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js",
      "firebase/auth":      "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase-analytics": "https://www.gstatic.com/firebasejs/12.12.1/firebase-analytics.js",
      "firebase/ai":        "https://www.gstatic.com/firebasejs/12.12.1/firebase-ai.js"
    }
  }

  <script type="module">
    import "../../dedial/dedial.js";
    import "../../component/DeInputList/index3.js";
    import "../../component/DeForm/index.js";
    import "../../component/DeDialogForm/index.js";
    import "../../component/DeDialogAlert/index.js";
    import "../../component/DeDialogConfirm/index.js";
    import "./component/DeToolbarMenu/index.js";
    import "./component/de-info/index.js";
    import "./component/de-edit-text/index.js";

    import * as fb_app from "firebase/app";
    import * as fb_ai from "firebase/ai";
    import DB_SCHEMA from "./db/schema.js";
    import Utils from "../../lib/Utils.js";
    import JUtils from "./lib/Utils.js";
    import Db from "./lib/Db.js";
    import AI from "./lib/AI.js";
    import Profile from "./lib/Profile.js";
    import Job from "./lib/Job.js";

    Main();
    async function Main()
    {
      const ctx =
      {
        ai: await AI.New(fb_app, fb_ai),
        db: await Db.New(DB_SCHEMA),
        db2: await Db.New(DB_SCHEMA),
        Profile, Utils, Job
      };

      const url_params = new URLSearchParams(window.location.search);
      const gen = url_params.has("gen", "true");

      const job_id_str = url_params.get("job_id");
      const job_id = Utils.Is_Empty(job_id_str) ? null : parseInt(job_id_str);
      const job = await ctx.Job.Select_By_Id(ctx, job_id);
  
      const profile = await ctx.Profile.Select(ctx);
      profile.work_history = await ctx.Profile.Job_Select(ctx);
      profile.education = await ctx.Profile.Edu_Select(ctx);

      if (gen || !job.cl)
      {
        info_elem.Info("Generating Cover Letter...");
        await Utils.sleep(1500);

        job.cl = await ctx.ai.Generate_Cover_Letter(profile, job);
        await ctx.Job.Save(ctx, job);
        info_elem.Info();
      }

      name_elem.innerText = profile.name;
      phone_elem.innerText = profile.phone;
      email_elem.innerText = profile.email;
      linkedin_elem.innerText = profile.linkedin_url;
      seek_elem.innerText = profile.seek_url;

      role_elem.innerText = job.role_title;
      company_elem.innerText = job.company;
      link_elem.innerText = job.link;

      cover_letter.innerText = job.cl;

      signature_elem.innerText = profile.name;
    }
  </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Website",
      "name": "Job Woper",
      "url": "https://dulceeng.com.au/apps/job-woper",
      "description": "",
      "image": "https://dulceeng.com.au/apps/job-woper/image/screenshot-landscape.png"
    }
    </script>

    <script type="module">
      import Utils from "../../lib/Utils.js";
      import "../../component/DeDialogForm/index.js";
      import "../../component/DeInputTree/index.js";
      import "../../component/DeTree/index.js";
      import "../../component/DeSelectTree/index.js";
      import "../../component/DeLineChart/index.js";
      import "../../component/DeInputList/index.js";

      const storage_key = "jobwoper";

      class Query
      {
        static async Select_All()
        {
          const res_http = await fetch("db/query.json");
          const queries = await res_http.json();
          // sort by order

          return queries;
        }
      }

      class Trend
      {
        static async Select_By_Query_Id(query_id)
        {
          const res_http = await fetch(`db/trend/query${query_id}.json`);
          const trends = await res_http.json();
          // sort by datetime

          return trends;
        }
      }

      Init();
      async function Init()
      {
        if ("serviceWorker" in navigator) 
        {
          //await navigator.serviceWorker.register("./lib/service-worker.js");
        }

        const observer = new MutationObserver(On_Mutation);
        On_Mutation.observer = observer;
        observer.observe(document.documentElement, { childList: true, subtree: false });
        
        function On_Mutation(mutations)
        {
          for (const mutation of mutations)
          {
            for (const node of mutation.addedNodes)
            {
              if (ads_elem && node.nodeType === 1 && node.nodeName == "IFRAME")
              {
                node.style.cssText = "width:100%;position:relative;border:none;";
                ads_elem.appendChild(node);

                console.log("iframe intercepted.");
              }
            }
          }
        }
      }

      Main();
      async function Main()
      {
        let queries = await Query.Select_All();
        queries = queries.filter(q => q.src == "seek" || q.src == undefined);
        queries.sort((a, b) => a.order - b.order);

        tech_select.items = queries;
        add_btn.addEventListener("click", On_Add_Btn_Click);

        const json_str = localStorage.getItem(storage_key);
        const charts = JSON.parse(json_str);

        chart_list.addEventListener("render", On_Render_Chart);
        chart_list.addEventListener("change", On_Change_Items);
        chart_list.value = charts;
      }

      // events =========================================================================

      function On_Change_Items()
      {
        const charts = chart_list.value;
        const json_str = JSON.stringify(charts);
        localStorage.setItem(storage_key, json_str);
        Update_Nav();
      }

      async function On_Add_Btn_Click()
      {
        const new_chart = await chart_form.Show_Async();
        if (new_chart)
        {
          new_chart.id = crypto.randomUUID();
          chart_list.Add(new_chart);
        }
      }

      async function On_Edit_Btn_Click(e, chart)
      {
        const new_chart = await chart_form.Show_Async(chart);
        if (new_chart)
        {
          chart_list.Add(new_chart);
        }
      }

      async function On_Render_Chart(event)
      {
        const item_elem = event.target;
        const chart = item_elem.item_obj;

        const queries = await Query.Select_All();
        const data = {}, trends = {};
        for (const query_id of chart.query_ids)
        {
          trends[query_id] = await Trend.Select_By_Query_Id(query_id);
          data[query_id] = trends[query_id].map(t => {return {x: t.datetime, y: t.count}});
        }

        item_elem.chart_elem.setAttribute("title", chart.title || "Chart");
        item_elem.chart_elem.del_btn.addEventListener("click", (e) => chart_list.Remove(chart.id));
        item_elem.chart_elem.edit_btn.addEventListener("click", (e) => On_Edit_Btn_Click(e, chart));
        item_elem.chart_elem.items = data;
        item_elem.chart_elem.addEventListener
          ("point-selected",  e => On_Pt_Selected(e, item_elem));
        Render_Summary(item_elem, trends, queries);
      }

      function On_Pt_Selected(event, item_elem)
      {
        const query_ids = event.detail;
        for (const query_id in query_ids) 
        {
          const data = query_ids[query_id];
          const date_str = new Date(data.x).toLocaleDateString();
          const job_count = data.y;

          item_elem.selection_time.innerText = date_str;
          const row_elem = item_elem.body_elem.querySelector(`tr[query-id="${query_id}"]`);
          const usage_elem = row_elem.querySelector(`[cid="selection_usage"]`);
          usage_elem.innerText = job_count;
        }
        
        const first_x = Object.values(query_ids)[0].x;
        const data_pt = {x: first_x, y: 0};
        const svg_pt = item_elem.chart_elem.Map_Data_To_SVG_Point(data_pt);
        const range = {x1: svg_pt.x, x2: svg_pt.x + 5};
        item_elem.chart_elem.Set_Highlight(range);
      }
      
      // rendering ======================================================================

      function Render_Summary(item_elem, data, queries)
      {
        const items = Object.values(data).flat();

        const start_item = Utils.Minimum(items, "datetime");
        const start_time = start_item.datetime;
        const start_date = new Date(start_item.datetime);

        const end_item = Utils.Maximum(items, "datetime");
        const end_time = end_item.datetime;
        const end_date = new Date(end_item.datetime);

        const d_time = end_time - start_time;
        const d_days = Math.floor(d_time / Utils.MILLIS_DAY);

        let color = 0;
        for (const query_id in data)
        {
          const items = data[query_id];
          const start_item = Utils.Minimum(items, "datetime");
          const end_item = Utils.Maximum(items, "datetime");

          const start_count = start_item.count;
          const end_count = end_item.count;
          const d_count = end_count - start_count;
          const percent_change = ((d_count / start_count) * 100).toFixed(2) + "%";
          const change_class = d_count > 0 ? "positive" : (d_count < 0 ? "negative" : "neutral");
          const trend_char = d_count > 0 ? "▲" : (d_count < 0 ? "▼" : "▬");

          const query = queries.find(q => q.id == query_id);

          const html = `
            <tr query-id="${query_id}">
              <td class="xtitle">
                <span>${query.title}</span>
                <span style="color:var(--c${color});">&#9632;</span>
              </td>
              <td class="xrange">
                ${start_count}
                -
                ${end_count}
              </td>
              <td class="xdiff" class="${change_class}">
                ${d_count} 
                (${percent_change}) 
                ${trend_char}
              </td>
              <td cid="selection_usage">n/a</td>
            </tr>
          `;
          item_elem.body_elem.insertAdjacentHTML('beforeend', html);

          color++;
        }

        item_elem.range_time.innerHTML = `
          <span class="start">${start_date.toLocaleDateString()}</span>
          <span class="separator">-</span>
          <span class="end">${end_date.toLocaleDateString()}</span>
        `;
        item_elem.diff_time.innerText = `${d_days} days`;
      }

      function Update_Nav()
      {

      }
    </script>

    <script src="https://vemtoutcheeg.com/400/8903613"></script>

  <body>

    <div id="ads_elem"></div>

    <header>
      <h1><span>Job Woper</span></h1>
      <nav>
        <button id="add_btn"><span class="text">Add Chart</span></button>
        <button id="del_all_btn" hidden><span class="text">Delete All</span></button>
      </nav>
    </header>

    <de-input-list id="chart_list">

      <de-line-chart cid="chart_elem" x-label="Time" y-label="Usage">
        <button cid="edit_btn" slot="title" class="header small">
          <span class="text">Edit</span>
        </button>
        <button cid="del_btn" slot="title" class="header small">
          <span class="text">Delete</span>
        </button>
      </de-line-chart>

      <table>
        <thead>
          <tr>
            <th></th>
            <th>Range</th>
            <th>Change</th>
            <th>Selection</th>
          </tr>
        </thead>
        <tbody cid="body_elem">
          <tr>
            <td>Time</td>
            <td cid="range_time"></td>
            <td cid="diff_time"></td>
            <td cid="selection_time"></td>
          </tr>
        </tbody>
      </table>

    </de-input-list>

    <footer>
      © Copyright Dulce Engineering 2025. All rights reserved. v1
    </footer>

    <de-dialog-form id="chart_form">
      <h1 slot="header"><span class="text">Chart Details</span></h1>
      <label slot="fields" for="title">Title</label>
      <input id="title" slot="fields" type="text" name="title"></input>
      <label slot="fields" for="tech_select">Tech</label>
      <de-select-tree id="tech_select" slot="fields" name="query_ids"></de-select-tree>
    </de-dialog-form>

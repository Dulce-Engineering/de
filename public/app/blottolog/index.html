<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blottolog - Captain's Log</title>
  <link rel="stylesheet" href="css/main.css">
  <meta name="theme-color" content="#EAC796">

  <script type="module">
    import Utils from "../../lib/Utils.js";
    import DeInputList from "../../component/DeInputList/index.js";

    const storage_key = "blottolog";

    const drink_types =
    [
      {id: 1, name: "Beer", icon: "🍺"},
      {id: 2, name: "Wine", icon: "🍷"},
      {id: 3, name: "Spirits", icon: "🥃"},
      {id: 4, name: "Cocktail", icon: "🍸"},
    ];
    const drink_sizes =
    [
      {id: 1, name: "Small", ml: 100},
      {id: 2, name: "Regular", ml: 200},
      {id: 3, name: "Large", ml: 300},
      {id: 4, name: "Middy", ml: 285},
      {id: 5, name: "Schooner", ml: 425},
      {id: 6, name: "Pint", ml: 568},
      {id: 7, name: "Half", ml: 100},
      {id: 8, name: "Single", ml: 200},
      {id: 9, name: "Double", ml: 300},
      {id: 10, name: "Short", ml: 300},
      {id: 11, name: "Tall", ml: 300},
    ];
    const wip_drinks =
    [
      {id: 1, type_id: 1, size_id: 1},
      {id: 2, type_id: 2, size_id: 2},
      {id: 3, type_id: 3, size_id: 3},
    ];

    Main();
    function Main()
    {
      const ctx = Get_Ctx();

      wip_drinks_elem.addEventListener("change", On_Change_Drink_Items);
      wip_drinks_elem.addEventListener("render", On_Render_Drink_Item);
      wip_drinks_elem.value = ctx?.wip_drinks;

      select_drink_form.addEventListener('submit', On_Submit_Drink);
    }

    function Get_Ctx()
    {
      const json_str = localStorage.getItem(storage_key);
      const blottolog_ctx = JSON.parse(json_str);
      return blottolog_ctx || {};
    }

    function Set_Ctx(blottolog_ctx)
    {
      const json_str = JSON.stringify(blottolog_ctx);
      localStorage.setItem(storage_key, json_str);
    }

    function On_Change_Drink_Items()
    {
      const ctx = Get_Ctx();
      ctx.wip_drinks = wip_drinks_elem.value;
      Set_Ctx(ctx);
      //Update_Nav();
    }

    function On_Render_Drink_Item(event)
    {
      const drink_elem = event.target;
      const drink = drink_elem.item_obj;

      const drink_type = drink_types.find(dt => dt.id === drink.type_id);
      const drink_size = drink_sizes.find(ds => ds.id === drink.size_id);

      drink_elem.drink_icon.innerHTML = drink_type.icon;

      const drink_label = `${drink_type.name} ${drink_size.name}`;
      drink_elem.drink_label.innerHTML = drink_label;

      drink_elem.addEventListener('click', On_Click_Drink_Item);
    }

    function On_Click_Drink_Item(event)
    {
      const drink_elem = event.currentTarget;
      const drink = drink_elem.item_obj;
      wip_drinks_elem.Remove(drink.id);
    }

    function On_Submit_Drink(e)
    {
      e.preventDefault();
      const button = e.submitter;
      if (button.classList.contains('drink-option'))
      {
        const drink_type_id = parseInt(button.dataset.drinkType);
        const drink_size_id = parseInt(button.dataset.drinkSize);
        const drink =
        {
          id: Date.now(), 
          type_id: drink_type_id, 
          size_id: drink_size_id
        };
        wip_drinks_elem.Add(drink);
      }
      select_drink_dlg.hidePopover();
    }
  </script>
</head>

<body>

  <header class="header">
    <button class="primary-button" aria-label="Profile">🫅</button>
    <svg viewBox="300 350 400 250" width="100%" height="100%">
      <defs>
        <path id="logo-curve" d="M 0 1000 Q 0 500 1000 400" />
      </defs>
      <use href="#logo-curve" class="trace" />
      <rect x="300" y="350" width="400" height="250" class="viewbox" />
      <text>
        <textPath href="#logo-curve" startOffset="61%" text-anchor="middle">
          <tspan font-size="180">B</tspan>
          <tspan font-size="165">l</tspan>
          <tspan font-size="150">o</tspan>
          <tspan font-size="135">t</tspan>
          <tspan font-size="120">t</tspan>
          <tspan font-size="105">o</tspan>
          <tspan font-size="90">l</tspan>
          <tspan font-size="75">o</tspan>
          <tspan font-size="60">g</tspan>
        </textPath>
      </text>
    </svg>
    <button class="primary-button" aria-label="Target">🤢</button>
  </header>

  <section class="timer">
    <div class="course-plot-graphic">
    </div>
    <div class="countdown-timer-display">
      34:12
    </div>
  </section>

  <section class="drinks">
    <de-input-list id="wip_drinks_elem">
      <span cid="drink_icon" class="icon">${icon}</span> 
      <span cid="drink_label" class="label">${label}</span> 
    </de-input-list>

    <ul id="finished-drinks"></ul>
    <button id="add_btn" class="action-button" popovertarget="select_drink_dlg">🍻</button>
    
    <dialog id="select_drink_dlg" popover>
      <form id="select_drink_form" method="dialog">
        <h2>Log New Cargo</h2>
        
        <div class="drink-category">
          <h3>Beer</h3>
          <div class="drink-options">
            <button type="submit" class="drink-option" data-drink-type="1" data-drink-size="4">
              <span class="icon">🍺</span>
              <span class="label">Middy 285ml</span>
            </button>
            <button type="submit" class="drink-option" data-drink-type="1" data-drink-size="5">
              <span class="icon" style="font-size: 1.4em;">🍺</span>
              <span class="label">Schooner 425ml</span>
            </button>
            <button type="submit" class="drink-option" data-drink-type="1" data-drink-size="6">
              <span class="icon" style="font-size: 1.8em;">🍺</span>
              <span class="label">Pint 570ml</span>
            </button>
          </div>
        </div>

        <div class="drink-category">
          <h3>Wine</h3>
          <div class="drink-options">
            <button type="submit" class="drink-option" data-drink-type="2" data-drink-size="1">
              <span class="icon">🍷</span>
              <span class="label">Small</span>
            </button>
            <button type="submit" class="drink-option" data-drink-type="2" data-drink-size="2">
              <span class="icon" style="font-size: 1.4em;">🍷</span>
              <span class="label">Regular</span>
            </button>
            <button type="submit" class="drink-option" data-drink-type="2" data-drink-size="3">
              <span class="icon" style="font-size: 1.8em;">🍷</span>
              <span class="label">Large</span>
            </button>
          </div>
        </div>

        <div class="drink-category">
          <h3>Spirits</h3>
          <div class="drink-options">
            <button type="submit" class="drink-option" data-drink-type="3" data-drink-size="7">
              <span class="icon">🥃</span>
              <span class="label">Half</span>
            </button>
            <button type="submit" class="drink-option" data-drink-type="3" data-drink-size="8">
              <span class="icon" style="font-size: 1.4em;">🥃</span>
              <span class="label">Single</span>
            </button>
            <button type="submit" class="drink-option" data-drink-type="3" data-drink-size="9">
              <span class="icon" style="font-size: 1.8em;">🥃</span>
              <span class="label">Double</span>
            </button>
          </div>
        </div>

        <div class="drink-category">
          <h3>Cocktail</h3>
          <div class="drink-options">
            <button type="submit" class="drink-option" data-drink-type="4" data-drink-size="10">
              <span class="icon">🍸</span>
              <span class="label">Short</span>
            </button>
            <button type="submit" class="drink-option" data-drink-type="4" data-drink-size="2">
              <span class="icon" style="font-size: 1.4em;">🍸</span>
              <span class="label">Regular</span>
            </button>
            <button type="submit" class="drink-option" data-drink-type="4" data-drink-size="11">
              <span class="icon" style="font-size: 1.8em;">🍸</span>
              <span class="label">Tall</span>
            </button>
          </div>
        </div>

        <div class="dialog-actions">
          <button type="button" class="secondary-button" popovertarget="select_drink_dlg" popovertargetaction="hide">
            ❌
          </button>
        </div>
      </form>
    </dialog>
  </section>

</body>

</html>

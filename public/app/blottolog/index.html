<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blottolog - Captain's Log</title>
  <link rel="stylesheet" href="main.css">
  <meta name="theme-color" content="#EAC796">

  <script type="module">
    import Utils from "../../lib/Utils.js";
    import "../../component/DeInputList/index3.js";
    import "../../component/DeDivider/index.js";
    import "../../component/DeTextEffect/index.js";
    import "../../component/DeDialogForm/index.js";
    import "../../component/DeLineChart/index.js";
    import Logic from "./lib/logic.js";

    const storage_key = "blottolog";

    const drink_types =
    [
      {id: 1, name: "Beer", icon: "🍺", alc_vol: 4.8},
      {id: 2, name: "Wine", icon: "🍷", alc_vol: 13.5},
      {id: 3, name: "Spirits", icon: "🥃", alc_vol: 40},
      {id: 4, name: "Cocktail", icon: "🍸", alc_vol: 20},
      {id: 5, name: "Mystery Drink", icon: "🍹", alc_vol: 5},
    ];
    const drink_sizes =
    [
      {id: 1, name: "Small", ml: 100},
      {id: 2, name: "Regular", ml: 200},
      {id: 3, name: "Large", ml: 300},
      {id: 4, name: "Middy", ml: 285},
      {id: 5, name: "Schooner", ml: 425},
      {id: 6, name: "Pint", ml: 568},
      {id: 7, name: "Half", ml: 100},
      {id: 8, name: "Single", ml: 200},
      {id: 9, name: "Double", ml: 300},
      {id: 10, name: "Short", ml: 300},
      {id: 11, name: "Tall", ml: 300},
    ];

    Main();
    function Main()
    {
      const ctx = Load_Ctx();

      wip_drinks_elem.addEventListener("render", On_Render_Drink_Item);
      wip_drinks_elem.value = Select_WIP_Drinks(ctx);
      finished_drinks_elem.addEventListener("render", On_Render_Finished_Drink_Item);
      finished_drinks_elem.value = Select_Finished_Drinks(ctx);

      select_drink_form.addEventListener('submit', On_Submit_Drink);
      delete_drink_btn.addEventListener('click', On_Click_Delete_Btn);
      finish_drink_btn.addEventListener('click', On_Click_Finish_Btn);

      beer_drink.addEventListener('click', On_Click_Drink);
      wine_drink.addEventListener('click', On_Click_Drink);
      spirit_drink.addEventListener('click', On_Click_Drink);
      cocktail_drink.addEventListener('click', On_Click_Drink);

      small_drink.addEventListener('click', On_Click_Size);
      regular_drink.addEventListener('click', On_Click_Size);
      large_drink.addEventListener('click', On_Click_Size);

      new_session_btn.addEventListener('click', On_Click_New_Session_Btn);
      profile_btn.addEventListener('click', On_Click_Profile_Btn);
      plot_all_drinks_btn.addEventListener('click', On_Click_Plot_All_Drinks_Btn);
      plot_drink_btn.addEventListener('click', On_Click_Plot_Drink_Btn);
      plot_finished_drink_btn.addEventListener('click', On_Click_Plot_Finished_Drink_Btn);
    }

    function Load_Ctx()
    {
      const json_str = localStorage.getItem(storage_key);
      const ctx = JSON.parse(json_str);
      return ctx || {};
    }

    function Save_Ctx(ctx)
    {
      const json_str = JSON.stringify(ctx);
      localStorage.setItem(storage_key, json_str);
    }

    function Update_Ctx(Update_Callback_Fn)
    {
      const ctx = Load_Ctx();
      Update_Callback_Fn(ctx);
      Save_Ctx(ctx);
    }

    // db ==========================================================================

    function Select_Drinks(ctx)
    {
      if (!ctx.drinks)
      {
        ctx.drinks = [];
      }
      return ctx.drinks;
    }

    function Select_WIP_Drinks(ctx)
    {
      const drinks = Select_Drinks(ctx);
      return drinks.filter(d => d.end_time == null);
    }

    function Select_Finished_Drinks(ctx)
    {
      const drinks = Select_Drinks(ctx);
      return drinks.filter(d => d.end_time != null);
    }

    function Insert_Drink(ctx, drink)
    {
      const drinks = Select_Drinks(ctx);
      drinks.push(drink);
    }

    function Update_Drink(ctx, drink)
    {
      const drinks = Select_Drinks(ctx);
      const index = drinks.findIndex(d => d.id === drink.id);
      drinks[index] = drink;
    }

    function Delete_Drinks(ctx)
    {
      ctx.drinks = [];
    }

    function Delete_Drink(ctx, drink_id)
    {
      const drinks = Select_Drinks(ctx);
      const index = drinks.findIndex(d => d.id === drink_id);
      if (index !== -1)
      {
        drinks.splice(index, 1);
      }
    }

    // business logic ==============================================================

    function Start_Session()
    {
      Update_Ctx(ctx => Delete_Drinks(ctx));

      //Update_Calc();
      //const interval_id = setInterval(Update_Calc, Utils.MILLIS_MINUTE);
    }

    function Start_Drink(drink_type_id, drink_size_id)
    {
      const drink =
      {
        id: Date.now(), 
        type_id: drink_type_id, 
        size_id: drink_size_id,
        start_time: Date.now(),
        end_time: null
      };

      wip_drinks_elem.Add(drink);
      Update_Ctx(ctx => Insert_Drink(ctx, drink));
      //Update_Calc();
    }

    function Update_Calc()
    {
      const ctx = Load_Ctx();
      const drinks = Select_Drinks(ctx);
      const user = ctx.profile || {};
      for (const drink of drinks)
      {
        drink.drink_type = drink_types.find(dt => dt.id === drink.type_id);
        drink.drink_size = drink_sizes.find(ds => ds.id === drink.size_id);
      }

      const wait_min = Logic.Get_Wait_Time_To_Next_Drink(drinks, user, Date.now());
      timer_elem.textContent = wait_min > 0 ? `Wait ${wait_min} min` : "Drink away!";
    }

    function Finish_Drink(drink)
    {
      drink.end_time = Date.now();

      wip_drinks_elem.Remove(drink.id);
      finished_drinks_elem.Add(drink);
      Update_Ctx(ctx => Update_Drink(ctx, drink));
    }

    function Discard_Drink(drink_id)
    {
      wip_drinks_elem.Remove(drink_id);
      Update_Ctx(ctx => Delete_Drink(ctx, drink_id));
    }

    // drinks list =================================================================

    function On_Render_Drink_Item(event)
    {
      const item_elem = event.target;
      const drink = item_elem.item_obj;

      const def_drink_type = drink_types.find(dt => dt.id === 5);
      const drink_type = drink_types.find(dt => dt.id === drink.type_id) || def_drink_type;
      const drink_size = drink_sizes.find(ds => ds.id === drink.size_id);
      const drink_label = `${drink_type.name}<br>${drink_size.name}`;

      item_elem.drink_icon.innerHTML = drink_type.icon;
      item_elem.drink_label.innerHTML = drink_label;
      item_elem.addEventListener('click', e => On_Click_Drink_Item(e, drink));
    }

    function On_Render_Finished_Drink_Item(event)
    {
      const item_elem = event.target;
      const drink = item_elem.item_obj;

      const def_drink_type = drink_types.find(dt => dt.id === 5);
      const drink_type = drink_types.find(dt => dt.id === drink.type_id) || def_drink_type;
      const drink_size = drink_sizes.find(ds => ds.id === drink.size_id);
      const drink_label = `${drink_type.name}<br>${drink_size.name}`;

      item_elem.drink_icon.innerHTML = drink_type.icon;
      item_elem.drink_label.innerHTML = drink_label;
      item_elem.addEventListener('click', e => On_Click_Finished_Drink_Item(e, drink));
    }

    function On_Click_Finished_Drink_Item(event, drink)
    {
      finished_drink_menu_dlg.item_obj = drink;
      finished_drink_menu_dlg.showPopover();
    }

    function On_Click_Plot_Finished_Drink_Btn(event)
    {
      finished_drink_menu_dlg.hidePopover();

      const drink = finished_drink_menu_dlg.item_obj;
      Update_BAC_Chart([drink]);
    }

    function On_Click_Drink_Item(event, drink)
    {
      drink_menu_dlg.item_obj = drink;
      drink_menu_dlg.showPopover();
    }

    // choose drink dlg ============================================================

    function On_Submit_Drink(event)
    {
      event.preventDefault?.();
      const button = event.submitter;
      if (button.tagName === "BL-DRINK")
      {
        const drink_type_id = parseInt(button.dataset.drinkType);
        const drink_size_id = parseInt(button.dataset.drinkSize);
        Start_Drink(drink_type_id, drink_size_id);
      }
      select_drink_dlg.hidePopover();
    }

    function On_Click_Size(event)
    {
      const drink_elem = event.currentTarget;
      On_Submit_Drink({submitter: drink_elem});
    }

    function On_Click_Drink(event)
    {
      const drink_elem = event.currentTarget;
      const icon = drink_elem.getAttribute("icon");
      const drink_type_id = parseInt(drink_elem.dataset.drinkType);

      small_drink.setAttribute("icon", icon);
      small_drink.dataset.drinkType = drink_type_id;
      regular_drink.setAttribute("icon", icon);
      regular_drink.dataset.drinkType = drink_type_id;
      large_drink.setAttribute("icon", icon);
      large_drink.dataset.drinkType = drink_type_id;
    }

    // drink menu ==================================================================

    function On_Click_Delete_Btn(event)
    {
      drink_menu_dlg.hidePopover();

      const drink = drink_menu_dlg.item_obj;
      Discard_Drink(drink.id);
    }

    function On_Click_Finish_Btn(event)
    {
      drink_menu_dlg.hidePopover();

      const drink = drink_menu_dlg.item_obj;
      Finish_Drink(drink);
    }

    function On_Click_Plot_Drink_Btn(event)
    {
      drink_menu_dlg.hidePopover();

      const drink = drink_menu_dlg.item_obj;
      Update_BAC_Chart([drink]);
    }

    function On_Click_Plot_All_Drinks_Btn(event)
    {
      main_menu_dlg.hidePopover();

      const ctx = Load_Ctx();
      const drinks = Select_Drinks(ctx);
      Update_BAC_Chart(drinks);
    }

    function Update_BAC_Chart(drinks)
    {
      const ctx = Load_Ctx();
      const user = ctx.profile;

      if (!user || !user.weight || !user.sex)
      {
        alert("Please set your profile details first (Weight and Sex are required for calculation).");
        return;
      }

      if (Utils.isEmpty(drinks)) return;

      const r = Logic.Get_Volume_Distribution_Factor(user);
      const Vd = user.weight * r;

      const start_time = Math.min(...drinks.map(d => d.start_time));
      const end_time = Date.now() + (Utils.MILLIS_HOUR * 12);
      const step = Utils.MILLIS_MINUTE * 10;

      const drink_data = drinks.map(d => {
        const type = drink_types.find(dt => dt.id === d.type_id) || drink_types.find(dt => dt.id === 5);
        const size = drink_sizes.find(ds => ds.id === d.size_id);
        const alcohol_ml = size.ml * (type.alc_vol / 100);
        return { start: d.start_time, end: d.end_time, grams: alcohol_ml * 0.789 };
      });

      const points = [];
      for (let t = start_time; t <= end_time; t += step)
      {
        let total_bac = 0;
        for (const drink of drink_data)
        {
          if (t >= drink.start)
          {
            const relative_time_hr = (t - drink.start) / Utils.MILLIS_HOUR;
            let current_grams = drink.grams;
            if (drink.end)
            {
              const duration = drink.end - drink.start;
              const ratio = duration > 0 ? Math.min(1, (t - drink.start) / duration) : 1;
              current_grams = drink.grams * ratio;
            }
            total_bac += Logic.Bateman_BAC(current_grams, Vd, relative_time_hr);
          }
        }
        points.push({ x: t, y: total_bac });
      }

      bac_chart.items = 
      { 
        "bac": points, 
        "buzz": [{ x: start_time, y: 0.035 }, { x: end_time, y: 0.035 }] 
      };
      const now = Date.now();
      const range = { x1: now, x2: now + step };
      bac_chart.Set_Data_Highlight(range);
      bac_chart.hidden = false;
    }

    // main menu ===================================================================

    function On_Click_New_Session_Btn(event)
    {
      main_menu_dlg.hidePopover();

      if (confirm("Are you sure you want to start a new adventure? This will clear all your drinks.")) 
      {
        Start_Session();
        wip_drinks_elem.Clear();
        finished_drinks_elem.Clear();
      }
    }
    
    async function On_Click_Profile_Btn(event)
    {
      main_menu_dlg.hidePopover();

      const ctx = Load_Ctx();
      const new_profile = await profile_dlg.Show_Async(ctx.profile);
      if (new_profile)
      {
        ctx.profile = new_profile;
        Save_Ctx(ctx);
      }
    }
    
    // components ==================================================================

    class BL_Drink extends HTMLElement
    {
      static tname = "bl-drink";

      static observedAttributes = ['icon'];
      attributeChangedCallback(name, oldValue, newValue)
      {
        if (name === 'icon')
        {
          this.Update_Icon();
        }
      }

      Update_Icon()
      {
        if (this.drink_icon)
        {
          const icon = this.getAttribute("icon") || "🍹";
          this.drink_icon.innerHTML = icon;
        }
      }

      connectedCallback()
      {
        const label = this.getAttribute("label") || "";
        this.innerHTML = `
          <span cid="drink_icon" class="icon"></span> 
          <span cid="drink_label" class="label">${label}</span> 
        `;
        Utils.Set_Id_Shortcuts(this, this, "cid");

        this.Update_Icon();
      }
    }
    Utils.Register_Element(BL_Drink);
  </script>
</head>

<!-- 🧭 🗺️ ⚓ 🏝️ 🍻 🏴‍☠️ ⚔️ 💀 ⛵ 🪙 💰 🍹 🤢 📜 🧜‍♂️ -->
<body>

  <header>
    <svg viewBox="290 350 400 250" width="100%" height="100%">
      <defs>
        <path id="logo-curve" d="M 0 1000 Q 0 500 1000 400" />
        <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:var(--hdr-grd-start);stop-opacity:1" />
          <stop offset="100%" style="stop-color:var(--hdr-grd-end);stop-opacity:1" />
        </linearGradient>
      </defs>
      <use href="#logo-curve" class="trace" />
      <rect x="300" y="350" width="400" height="250" class="viewbox" />
      <text>
        <textPath href="#logo-curve" startOffset="61%" text-anchor="middle">
          <tspan font-size="180">B</tspan>
          <tspan font-size="165">l</tspan>
          <tspan font-size="150">o</tspan>
          <tspan font-size="135">t</tspan>
          <tspan font-size="120">t</tspan>
          <tspan font-size="105">o</tspan>
          <tspan font-size="90">l</tspan>
          <tspan font-size="75">o</tspan>
          <tspan font-size="60">g</tspan>
        </textPath>
      </text>
    </svg>
    <span class="skull">💀</span>
    <span class="drink">🍹</span>
    <span class="money">💰</span>
  </header>
  <button class="primary-button menu" aria-label="Menu" popovertarget="main_menu_dlg">📜</button>

  <section class="timer">
    <de-line-chart 
      id="bac_chart" 
      title="Alcohol" 
      x-label="Time" 
      y-label="BAC %"
      hidden
    >
    </de-line-chart>
    <div class="course-plot-graphic"></div>
    <div id="timer_elem" class="countdown-timer-display"></div>
  </section>

  <section class="drinks">

    <de-divider div-type="vintage-4"></de-divider>
    <h1>
      Drinks in Progress
      <button 
        id="add_btn" 
        class="action-button" 
        popovertarget="select_drink_dlg"
        slot="body"
      >➕</button>
    </h1>
    <de-input-list id="wip_drinks_elem">
      <li slot="no_items">
        <span class="icon">🙊</span>
      </li>
      <li slot="item">
        <span cid="drink_icon" class="icon"></span> 
        <span cid="drink_label" class="label"></span> 
      </li>
    </de-input-list>

    <de-divider div-type="vintage-4"></de-divider>
    <h1>Finished Drinks</h1>
    <de-input-list id="finished_drinks_elem">
      <li slot="no_items">
        <span class="icon">🙊</span>
      </li>
      <li slot="item">
        <span cid="drink_icon" class="icon"></span> 
        <span cid="drink_label" class="label"></span> 
      </li>
    </de-input-list>

  </section>
  
  <dialog id="select_drink_dlg" popover>
    <form id="select_drink_form" method="dialog">

      <h1>Choose a Drink...</h1>
      <div class="list">
        <bl-drink id="beer_drink" data-drink-type="1" icon="🍺" label="Beer"></bl-drink>
        <bl-drink id="wine_drink" data-drink-type="2" icon="🍷" label="Wine"></bl-drink>
        <bl-drink id="spirit_drink" data-drink-type="3" icon="🥃" label="Spirit"></bl-drink>
        <bl-drink id="cocktail_drink" data-drink-type="4" icon="🍸" label="Cocktail"></bl-drink>
      </div>

      <h1>and Size...</h1>
      <div class="list">
        <bl-drink id="small_drink" data-drink-size="1" icon="🍹" label="Small" class="small"></bl-drink>
        <bl-drink id="regular_drink" data-drink-size="2" icon="🍹" label="Regular" class="regular"></bl-drink>
        <bl-drink id="large_drink" data-drink-size="3" icon="🍹" label="Large" class="large"></bl-drink>
      </div>

      <div class="dialog-actions">
        <button 
          type="button" 
          class="secondary-button" 
          popovertarget="select_drink_dlg" 
          popovertargetaction="hide">
          ❌
        </button>
      </div>
    </form>
  </dialog>

  <!-- drinks menu ================================================================ -->
  <dialog id="drink_menu_dlg" popover class="menu-dlg">
    <form id="drink_menu_form" method="dialog">
      <button id="finish_drink_btn">Drink Finished! <span class="primary-button">💎</span></button>
      <button id="delete_drink_btn">Cast Away <span class="primary-button">💎</span></button>
      <button id="plot_drink_btn">Plot Alcohol <span class="primary-button">💎</span></button>
    </form>
  </dialog>

  <!-- finished drinks menu ======================================================= -->
  <dialog id="finished_drink_menu_dlg" popover class="menu-dlg">
    <form id="finished_drink_menu_form" method="dialog">
      <button id="plot_finished_drink_btn">Plot Alcohol <span class="primary-button">📈</span></button>
    </form>
  </dialog>

  <!-- main menu ================================================================== -->
  <dialog id="main_menu_dlg" popover class="menu-dlg">
    <form id="main_menu_form" method="dialog">
      <button id="new_session_btn">New Adventure <span class="primary-button">🏴‍☠️</span></button>
      <button id="plot_all_drinks_btn">Plot Alcohol <span class="primary-button">📈</span></button>
      <button id="profile_btn">Profile <span class="primary-button">💀</span></button>
    </form>
  </dialog>

  <de-dialog-form id="profile_dlg" label-ok="✔️" label-cancel="❌" label-clr="🧹">
    <h1 slot="header">Your Details</h1>
  
    <label slot="fields">Sex:</label>
    <div slot="fields">
      <input type="radio" name="sex" value="male"> Male /
      <input type="radio" name="sex" value="female"> Female
    </div>
  
    <label slot="fields">Date of Birth:</label>
    <input slot="fields" name="dob" type="date">

    <label slot="fields">Weight (kg):</label>
    <input slot="fields" name="weight" type="number">

    <label slot="fields">Height (cm):</label>
    <input slot="fields" name="height" type="number">
  </de-dialog-form>

</body>

</html>

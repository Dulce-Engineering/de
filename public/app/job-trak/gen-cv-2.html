  <script type="importmap">
  {
    "imports": 
    {
      "firebase/app":       "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/functions": "https://www.gstatic.com/firebasejs/12.12.1/firebase-functions.js",

  <script type="module">
    import "../../dedial/dedial.js";
    import "../../component/DeInputList/index3.js";
    import "../../component/DeForm/index.js";
    import "../../component/DeDialogForm/index.js";
    import "../../component/DeDialogAlert/index.js";
    import "../../component/DeDialogConfirm/index.js";
    import "./component/DeToolbarMenu/index.js";
    import "./component/de-info/index.js";
    import "./component/de-edit-text/index.js";

  <script src="./lib/CV.js" type="module"></script>

  <style>
    @font-face 
    {
      font-family: roboto;
      src: url("font/Roboto/Roboto-VariableFont_wdth-wght.ttf");
    }
    @font-face 
    {
      font-family: roboto-condensed;
      src: url("font/Roboto_Condensed/RobotoCondensed-VariableFont_wght.ttf");
    }

    :root 
    {
      background-color: #fff;
      font-family: roboto;
      font-size: 14px;
    }
    body 
    {
      display: grid;
      grid-template-columns: 5fr 4fr;
      grid-template-areas: 
        "personal skills"
        "experience experience"
        "legacy-exp legacy-exp";
      xflex-direction: column;
      xalign-items: center;
      xbox-sizing: border-box;
      min-height: 100vh;
      margin: 0;
    }
    @media screen
    {
      body
      {
        padding: 80px;
        gap: 60px;
      }
      h1
      {
        font-size: 4rem;
      }
    }
    @media print
    {
      body
      {
        padding: 30px 10px 0 10px;
        gap: 30px;
      }
      h1
      {
        font-size: 3rem;
      }
    }

    #about, #tech_skills
    {
      margin: 20px 0 0 0;
    }
    #personal
    {
      grid-area: personal;
    }
    #skills
    {
      grid-area: skills;
    }
    #experience
    {
      grid-area: experience;
    }
    #legacy_exp
    {
      grid-area: legacy-exp;

      div
      {
        margin: 0 0 10px 0;
      }
    }

    article
    {
      display: flex;
      flex-direction: column;
      gap: 10px;
      xalign-items: center;
      align-items: stretch;

      &.compact
      {
        flex-direction: row;
      }
    }
    dl
    {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-block-start: 0;
      margin-block-end: 0;
    }
    dt
    {
      display: inline-block;
    }
    dd
    {
      display: inline-block;
      margin: 0;
      margin-inline-start: 0;
    }
    h1
    {
      xdisplay: block;
      margin-block-start: 0;
      margin-block-end: 0;
      margin-inline-start: 0;
      margin-inline-end: 0;
      font-weight: bold;
    }
    h2
    {
      xdisplay: block;
      font-size: 1.8rem;
      xletter-spacing: 1px;
      margin-block-start: 0;
      margin-block-end: 0;
      margin-inline-start: 0;
      margin-inline-end: 0;
      font-weight: bold;
      xborder-bottom: 1px solid #fff;
      border-bottom: 1px solid #000;
      padding: 0 0 12px 0;
      margin: 0 0 4px 0;
    }
    h3, .h3
    {
      font-size: 1.6rem;
      margin-block-start: 0;
      margin-block-end: 0;
      margin-inline-start: 0;
      margin-inline-end: 0;
      font-weight: normal;
      margin: 0 0 6px 0;
    }
    ul
    {
      display: flex;
      flex-direction: column;
      gap: 10px;
      list-style-type: disc;
      margin-block-start: 0;
      margin-block-end: 0;
      padding-inline-start: 20px;
    }
    #skills_value ul
    {
      display: block;
      column-count: 2;
      column-gap: 20px;
    }
    p
    {
      line-height: 1.4rem;
      display: block;
      margin-block-start: 0;
      margin-block-end: 0;
      margin-inline-start: 0;
      margin-inline-end: 0;
    }
    footer
    {
      display: block;
      font-size: 1.2rem;
      opacity: 0.6;
      margin: 0;
      padding: 0;
    }
    de-input-list
    {
      main
      {
        display: flex;
        flex-direction: column;
        xgap: 30px;
      }
    }
    de-info
    {
      [cid=info_elem]
      {
        color: #000;
        background-color: #fffe;
        padding: 10px 20px;
      }
    }

    .no-break
    {
      break-inside: avoid;
      padding: 40px 0 0 0;
    }
    .separate
    {
      margin: 10px 0 0 0;
    }
    .subheading
    {
      display: inline-block;
      font-size: 1.2rem;
      opacity: 0.6;
      margin: 0 0 5px 0;
    }
    .highlight
    {
      font-weight: bold;
      font-size: 1.2rem;
    }
    .coloured
    {
      xbackground-color: #44a;
      xcolor: #fff;

      de-input-list main
      {
        gap: 30px;
      }
      de-input-list main, dl
      {
        margin: 0 20px 0 0;
      }
    }
    .sidebar
    {
      width: 30%;
      display: flex;
      flex-direction: column;
      gap: 40px;
      margin: 40px 0 40px 30px;
      padding: 0 30px 0 0;
      border-right: 1px solid #000;
    }
    .main
    {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 40px;
      padding: 40px 30px 40px 30px;

      h2
      {
        border-bottom: 1px solid #000;
      }
    }

    #summ_value
    {
      font-family: roboto-condensed;
    }
    #jobs_list
    {
      main div
      {
        p, div
        {
          font-family: roboto-condensed;
        }
      }
    }
  </style>

</head>

<body>

  <section id="personal">
    <header><h1 id="prof_name"></h1></header>
    <article class="compact">
      <dl id="prof_email_field">
        <dt><img src="image/black/mail.svg"></dt>
        <dd></dd>
      </dl>
      <dl id="prof_phone_field">
        <dt><img src="image/black/call.svg"></dt>
        <dd></dd>
      </dl>
    </article>
    <article class="compact">
      <dl id="prof_address_field">
        <dt><img src="image/black/home.svg"></dt>
        <dd></dd>
      </dl>
      <dl id="prof_residency_field">
        <dt><img src="image/black/passport.svg"></dt>
        <dd></dd>
      </dl>
    </article>
    <article class="compact">
      <dl id="prof_website_field">
        <dt><img src="image/black/website.svg"></dt>
        <dd></dd>
      </dl>
      <dl id="prof_links_field">
        <dt><img src="image/black/link.svg"></dt>
        <dd id="prof_links_value"></dd>
      </dl>
    </article>
    <!-- summary -->
    <article id="about">
      <h2>About Me</h2>
      <p id="summ_value"></p>
    </article>
  </section>

  <section id="skils">
    <!-- education -->
    <article>
      <h2>Education</h2>
      <de-input-list id="education_list">
        <div slot="item">
          <h3 cid="edu_title"></h3>
          <div cid="edu_institution" class="highlight"></div>
        </div>
      </de-input-list>
    </article>
    <!-- skills -->
    <article id="tech_skills">
      <h2>Technical Skills</h2>
      <div id="skills_value"></div>
    </article>
  </section>

  <!-- experience -->
  <article id="experience">
    <h2>Work Experience</h2>
    <de-input-list id="jobs_list">
      <div slot="item" class="no-break">
        <span class="subheading" cid="job_company"></span> | 
        <span class="subheading" cid="dates"></span>
        <de-edit-text cid="job_title" class="h3"></de-edit-text>
        <p cid="job_description"></p>
        <div class="separate" cid="job_points"></div>
        <div class="separate">Tech: <span cid="job_tech"></span></div>
      </div>
    </de-input-list>
  </article>

  <!-- legacy experience -->
  <article id="legacy_exp">
    <de-input-list id="legacy_jobs_list">
      <div slot="item" class="">
        <span class="subheading" cid="job_title"></span> |
        <span class="subheading" cid="job_company"></span> |
        <span class="subheading" cid="dates"></span>
      </div>
    </de-input-list>
  </article>

  <footer>Previous role details available on request.</footer>

  <de-info id="info_elem"></de-info>

</body>

</html>

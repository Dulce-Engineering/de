      "@context": "https://schema.org",
      "@type": "Website",
      "name": "Job Tracker",
      "url": "https://dulceeng.com.au/app/xxx",

    <script type="module">
      import Utils from "../../lib/Utils.js";
      import "../../component/DeInputList/index3.js";
      import "../../component/DeDialogForm/index.js";

      Main();
      async function Main()
      {
        if ("serviceWorker" in navigator) 
        {
          //await navigator.serviceWorker.register("./lib/service-worker.js");
        }

        const db = await Open_DB();

        import_btn.onclick = On_Click_Import_Btn;
        jobs_list.addEventListener("render", e => On_Render_Job_Item(e, db));

        Render_Job_Items(db);
      }

      // events =========================================================================

      async function On_Click_Import_Btn(db)
      {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';

        input.onchange = async (e) => 
        {
          const file = e.target.files[0];
          if (!file) return;

          try 
          {
            const text = await file.text();
            const db_data = JSON.parse(text);
            await Clear_DB(db);
            await Save_To_IndexedDB(db, db_data);
            Render_Job_Items(db);
            alert("Data imported from " + file.name + " to IndexedDB instance.");
          }
          catch (err)
          {
            alert("Failed to import: Please select a valid JSON database file.");
          }
        };

        input.click();
      }

      async function On_Click_Add_Note(e, job_id, db)
      {
        const form_data = await note_dialog.Show_Async();
        if (form_data)
        {
          const now = new Date();
          const action =
          {
            job_id,
            time_str: now.toISOString().split('T')[0],
            timestamp: now.getTime(),
            note: form_data.note
          };
          await Insert(db, "action_logs", action);
          
          await Update(db, "jobs", { id: job_id, status: form_data.status });

          await Render_Job_Items(db);
        }
      }

      // db =============================================================================

      async function Clear_DB(db)
      {
        const storeNames = ["jobs", "agencies", "contacts", "action_logs"];
        const tx = db.transaction(storeNames, "readwrite");
        
        for (const storeName of storeNames) 
        {
          tx.objectStore(storeName).clear();
        }

        return new Promise((resolve) => tx.oncomplete = resolve);
      }

      async function Open_DB()
      {
        const promise = new Promise(On_Process);
        function On_Process(resolve, reject)
        {
          const request = indexedDB.open("JobTrakDB", 1);
          request.onupgradeneeded = (event) => 
          {
            const db = event.target.result;
            if (!db.objectStoreNames.contains("jobs")) db.createObjectStore("jobs", { keyPath: "id" });
            if (!db.objectStoreNames.contains("agencies")) db.createObjectStore("agencies", { keyPath: "id" });
            if (!db.objectStoreNames.contains("contacts")) db.createObjectStore("contacts", { keyPath: "id" });
            if (!db.objectStoreNames.contains("action_logs")) db.createObjectStore("action_logs", { keyPath: "id" });
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        }

        return promise;
      }

      async function Save_To_IndexedDB(db, db_data)
      {
        const storeNames = ["jobs", "agencies", "contacts", "action_logs"];
        const tx = db.transaction(storeNames, "readwrite");
        
        function putItems(storeName, items) 
        {
          const store = tx.objectStore(storeName);
          (items || []).forEach(item => store.put(item));
        }

        putItems("jobs", db_data.jobs);
        putItems("agencies", db_data.agencies);
        putItems("contacts", db_data.contacts);
        putItems("action_logs", db_data.action_logs);

        return new Promise((resolve) => tx.oncomplete = resolve);
      }

      function Get_Req_Res(request)
      {
        const res_promise = new Promise((resolve, reject) =>
        {
          request.onsuccess = () => resolve(request.result || null);
          request.onerror = () => On_Db_Error(request, reject);
        });

        return res_promise;
      }

      function On_Db_Error(request, reject_fn)
      {
        console.error("IndexedDB error:", request.error);
        reject_fn(request.error);
      }

      function Get_Table(db, table_name, is_readonly = true)
      {
        const tx = db.transaction([table_name], is_readonly ? "readonly" : "readwrite");
        const store = tx.objectStore(table_name);
        return store;
      }

      async function Next_Id(db, table)
      {
        const data = await Get_Req_Res(table.getAll());
        const nextId = (data || []).reduce
          ((max, action) => Math.max(max, action.id || 0), 0) + 1;
        return nextId;
      }

      function Select_By_Id(db, table_name, id)
      {
        const table = Get_Table(db, table_name);
        const request = table.get(id);
        return Get_Req_Res(request);
      }

      async function Insert(db, table_name, item)
      {
        const table = Get_Table(db, table_name, false);
        item.id = await Next_Id(db, table);
        const request = table.add(item);
        return Get_Req_Res(request);
      }

      async function Update(db, table_name, new_item)
      {
        let res = null;

        const table = Get_Table(db, table_name, false);
        const existing_item = await Get_Req_Res(table.get(new_item.id));
        if (existing_item)
        {
          const combined_item = { ...existing_item, ...new_item };
          const request = table.put(combined_item);
          res = Get_Req_Res(request);
        }

        return res;
      }

      // business logic =================================================================

      // rendering ======================================================================

      async function Render_Job_Items(db)
      {
        const jobs = await Get_Req_Res(Get_Table(db, "jobs").getAll());
        const agencies = await Get_Req_Res(Get_Table(db, "agencies").getAll());
        const contacts = await Get_Req_Res(Get_Table(db, "contacts").getAll());
        const actionLogs = await Get_Req_Res(Get_Table(db, "action_logs").getAll());

        // Map the IDs to names by looking up values in the related datasets
        const enrichedJobs = (jobs || []).map(job => ({
          ...job,
          agency_name: agencies?.find(a => a.id === job.agency_id)?.name || "N/A",
          contact_name: contacts?.find(c => c.id === job.contact_id)?.name || "N/A"
        }));

        // Enrich jobs with the latest action log note and its formatted time
        enrichedJobs.forEach(Add_Latest_Note);
        function Add_Latest_Note(job) 
        {
          const latestLog = (actionLogs || []).filter(log => log.job_id === job.id).sort((a, b) => b.timestamp - a.timestamp || b.id - a.id)[0];
          job.latest_note = latestLog?.note || "No notes available.";
          job.latest_note_time_formatted = latestLog ? new Date(latestLog.timestamp).toLocaleString() : "";
        }

        jobs_list.value = enrichedJobs;
      }

      function On_Render_Job_Item(event, db)
      {
        const itemElem = event.target;
        const job = itemElem.item_obj;

        itemElem.role_title_elem.textContent = job.role_title;
        itemElem.role_type_elem.textContent = job.role_type;
        itemElem.location_elem.textContent = job.location;
        itemElem.remuneration_elem.textContent = job.remuneration;
        itemElem.remuneration_unit_elem.textContent = job.remuneration_unit;
        itemElem.agency_name_elem.textContent = job.agency_name;
        itemElem.contact_name_elem.textContent = job.contact_name;
        itemElem.latest_note_elem.textContent = job.latest_note;
        itemElem.latest_note_time_elem.textContent = job.latest_note_time_formatted;
        itemElem.add_note_btn.onclick = e => On_Click_Add_Note(e, job.id, db);
      }

    </script>

            <span cid="remuneration_elem"></span> 
            <span cid="remuneration_unit_elem"></span>
          </p>

            <i cid="latest_note_elem"></i> 
          </p>
        </details>
      </de-input-list>

      <h1 slot="header">Add Job Note</h1>

        <option value="applying">Applying</option>
        <option value="applied">Applied</option>
        <option value="screening">Screening</option>
        <option value="interviewing">Interviewing</option>
        <option value="negotiating">Negotiating</option>
        <option value="offered">Offered</option>
        <option value="accepted">Accepted</option>
        <option value="rejected">Rejected</option>
        <option value="withdrawn">Withdrawn</option>
        <option value="ghosted">Ghosted</option>
      </select>
    </de-dialog-form>

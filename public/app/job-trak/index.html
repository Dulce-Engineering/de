  <script type="importmap">
  {
    "imports": 
    {
      "firebase/app":       "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/functions": "https://www.gstatic.com/firebasejs/12.12.1/firebase-functions.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js",
      "firebase/auth":      "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase-analytics": "https://www.gstatic.com/firebasejs/12.12.1/firebase-analytics.js",

  <script type="module">
    import Utils from "../../lib/Utils.js";
    import "../../component/DeInputList/index3.js";
    import "../../component/DeDialogForm/index.js";
    import * as fb_app from "firebase/app";
    import * as fb_ai from "firebase/ai";

    /*
      agencies
        id: int
        name: string
        url: string

      contacts
        id: int
        agency_id: int
        email: string
        name: string
        phone: string
        position: string

      jobs
        agency_id: int
        company
        contact_id: int
        duration: string
        jd_id: string
        location: string
        remuneration: float
        remuniration_unit: string
        role_title: string
        role_type: string
        status: string
        source: string
    */
    const job_status =
      [
        { id: "bookmarked", label: "Bookmarked", type: 0 },
        { id: "applying", label: "Applying", type: 0 },
        { id: "applied", label: "Applied", type: 0 },
        { id: "screening", label: "Screening", type: 0 },
        { id: "interviewing", label: "Interviewing", type: 0 },
        { id: "negotiating", label: "Negotiating", type: 0 },
        { id: "offered", label: "Offered", type: 0 },
        { id: "accepted", label: "Accepted", type: 0 },
        { id: "rejected", label: "Rejected", type: 1 },
        { id: "withdrawn", label: "Withdrawn", type: 1 },
        { id: "ghosted", label: "Ghosted", type: 1 },
        { id: "dismissed", label: "Not interested", type: 1 },
      ];

    Main();
    async function Main()
    {
      const response = await fetch("/__/firebase/init.json");
      const fb_config = await response.json();
      const app = fb_app.initializeApp(fb_config);

      const ai = fb_ai.getAI(app, { backend: new fb_ai.GoogleAIBackend() });
      const email_schema = 
      {
        type: "object",
        properties: 
        {
          agencyName: 
          {
            type: "string",
            description: "The official name of the recruitment agency or consulting firm."
          },
          websiteUrl: 
          {
            type: "string",
            description: "The main website URL of the agency (e.g., https://example.com). If not explicitly found, infer it from the sender's email domain."
          }
        },
        required: ["agencyName", "websiteUrl"]
      };
      const model_config = 
      {
        model: "gemini-2.5-flash-lite",
        generationConfig: 
        {
          responseMimeType: "application/json",
          responseSchema: email_schema,
          temperature: 0.1
        }
      };
      const model = fb_ai.getGenerativeModel(ai, model_config);

      if ("serviceWorker" in navigator) 
      {
        //await navigator.serviceWorker.register("./lib/service-worker.js");
      }

      const db = await Open_DB();

      Set_Options(note_status_select, job_status, "id", "label");
      Set_Options(job_status_select, job_status, "id", "label");

      import_btn.onclick = On_Click_Import_Btn;
      export_btn.onclick = () => On_Click_Export_Btn(db);
      jobs_btn.onclick = () => Toggle_View(jobs_list);
      contacts_btn.onclick = () => Toggle_View(contacts_list);
      add_job_btn.onclick = () => On_Click_Add_Job(db);
      ai_add_job_btn.onclick = () => On_Click_AI_Add_Job(db, model);
      add_contact_btn.onclick = () => On_Click_Add_Contact(db);
      jobs_list.addEventListener("render", e => On_Render_Job_Item(e, db));
      contacts_list.addEventListener("render", e => On_Render_Contact_Item(e, db));

      Render_Job_Items(db);
      Render_Contacts(db);
    }

    // events =========================================================================

    function Toggle_View(view_elem)
    {
      jobs_list.classList.add("hidden");
      contacts_list.classList.add("hidden");
      view_elem.classList.remove("hidden");
    }

    async function On_Click_Import_Btn(db)
    {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';

      input.onchange = async (e) => 
      {
        const file = e.target.files[0];
        if (!file) return;

        try 
        {
          const text = await file.text();
          const db_data = JSON.parse(text);
          await Clear_DB(db);
          await Save_To_IndexedDB(db, db_data);
          Render_Job_Items(db);
          alert("Data imported from " + file.name + " to IndexedDB instance.");
        }
        catch (err)
        {
          alert("Failed to import: Please select a valid JSON database file.");
        }
      };

      input.click();
    }

    async function On_Click_Export_Btn(db)
    {
      const jobs = await Get_Req_Res(Get_Table(db, "jobs").getAll());
      const agencies = await Get_Req_Res(Get_Table(db, "agencies").getAll());
      const contacts = await Get_Req_Res(Get_Table(db, "contacts").getAll());
      const action_logs = await Get_Req_Res(Get_Table(db, "action_logs").getAll());

      const db_data = {
        jobs: jobs || [],
        agencies: agencies || [],
        contacts: contacts || [],
        action_logs: action_logs || []
      };

      const json_string = JSON.stringify(db_data, null, 2);
      const blob = new Blob([json_string], { type: 'application/json' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = `job-trak-data-${new Date().toISOString().split('T')[0]}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      alert("Data exported successfully!");
    }

    async function On_Click_Add_Note(e, job_id, db)
    {
      const form_data = await note_dialog.Show_Async();
      if (!Utils.Is_Empty(form_data?.note))
      {
        const now = new Date();
        const action =
        {
          job_id,
          time_str: now.toISOString().split('T')[0],
          timestamp: now.getTime(),
          note: form_data.note
        };
        await Insert(db, "action_logs", action);
      }

      if (!Utils.Is_Empty(form_data?.status))
      {
        await Update(db, "jobs", { id: job_id, status: form_data.status });
      }

      await Render_Job_Items(db);
    }

    async function On_Click_Add_Job(db)
    {
      const agencies = await Get_Req_Res(Get_Table(db, "agencies").getAll());
      const contacts = await Get_Req_Res(Get_Table(db, "contacts").getAll());
      Set_Options(job_agency_select, agencies, "id", "name");
      Set_Options(job_contact_select, contacts, "id", "name");

      const form_data = await job_dialog.Show_Async();
      if (form_data)
      {
        const job =
        {
          role_title: form_data.role_title?.trim() || null,
          role_type: form_data.role_type?.trim() || null,
          location: form_data.location?.trim() || null,
          remuneration: parseFloat(form_data.remuneration) || null,
          remuneration_unit: form_data.remuneration_unit?.trim() || null,
          agency_id: parseInt(form_data.agency_id) || null,
          contact_id: parseInt(form_data.contact_id) || null,
          status: form_data.status || "bookmarked"
        };

        await Insert(db, "jobs", job);
        await Render_Job_Items(db);
      }
    }

    async function On_Click_AI_Add_Job(db, model)
    {
      const form_data = await email_dialog.Show_Async();
      if (form_data?.email_text)
      {
        const prompt = `
          Analyze the following email and extract the recruitment agency details. 
          Email content:
          
          ${form_data.email_text}
        `;

        const result = await model.generateContent(prompt);
        const agency_data = JSON.parse(result.response.text());

        console.info(agency_data);
        alert("Job extracted and added successfully!");
      }
    }

    async function On_Click_Edit_Job(event, job_id, db)
    {
      const agencies = await Get_Req_Res(Get_Table(db, "agencies").getAll());
      const contacts = await Get_Req_Res(Get_Table(db, "contacts").getAll());
      Set_Options(job_agency_select, agencies, "id", "name");
      Set_Options(job_contact_select, contacts, "id", "name");
      const curr_job = await Select_By_Id(db, "jobs", job_id);

      const form_data = await job_dialog.Show_Async(curr_job);
      if (form_data)
      {
        const job =
        {
          id: job_id,
          role_title: form_data.role_title?.trim() || null,
          role_type: form_data.role_type?.trim() || null,
          location: form_data.location?.trim() || null,
          remuneration: parseFloat(form_data.remuneration) || null,
          remuneration_unit: form_data.remuneration_unit?.trim() || null,
          agency_id: parseInt(form_data.agency_id) || null,
          contact_id: parseInt(form_data.contact_id) || null,
          status: form_data.status || null
        };

        await Update(db, "jobs", job);
        await Render_Job_Items(db);
      }
    }

    async function On_Click_Add_Contact(db)
    {
      const agencies = await Get_Req_Res(Get_Table(db, "agencies").getAll());
      Set_Options(contact_agency_select, agencies, "id", "name");

      const form_data = await contact_dialog.Show_Async();
      if (form_data)
      {
        const contact =
        {
          name: form_data.name?.trim() || null,
          email: form_data.email?.trim() || null,
          phone: form_data.phone?.trim() || null,
          position: form_data.position?.trim() || null,
          agency_id: parseInt(form_data.agency_id) || null,
        };

        await Insert(db, "contacts", contact);
        await Render_Contacts(db);
      }
    }

    // db =============================================================================

    async function Clear_DB(db)
    {
      const storeNames = ["jobs", "agencies", "contacts", "action_logs"];
      const tx = db.transaction(storeNames, "readwrite");

      for (const storeName of storeNames) 
      {
        tx.objectStore(storeName).clear();
      }

      return new Promise((resolve) => tx.oncomplete = resolve);
    }

    async function Open_DB()
    {
      const promise = new Promise(On_Process);
      function On_Process(resolve, reject)
      {
        const request = indexedDB.open("JobTrakDB", 1);
        request.onupgradeneeded = (event) => 
        {
          const db = event.target.result;
          if (!db.objectStoreNames.contains("jobs")) db.createObjectStore("jobs", { keyPath: "id" });
          if (!db.objectStoreNames.contains("agencies")) db.createObjectStore("agencies", { keyPath: "id" });
          if (!db.objectStoreNames.contains("contacts")) db.createObjectStore("contacts", { keyPath: "id" });
          if (!db.objectStoreNames.contains("action_logs")) db.createObjectStore("action_logs", { keyPath: "id" });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      }

      return promise;
    }

    async function Save_To_IndexedDB(db, db_data)
    {
      await Insert_Items(db, "jobs", db_data.jobs);
      await Insert_Items(db, "agencies", db_data.agencies);
      await Insert_Items(db, "contacts", db_data.contacts);
      await Insert_Items(db, "action_logs", db_data.action_logs);
    }

    function Get_Req_Res(request)
    {
      const res_promise = new Promise((resolve, reject) =>
      {
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => On_Db_Error(request, reject);
      });

      return res_promise;
    }

    function On_Db_Error(request, reject_fn)
    {
      console.error("IndexedDB error:", request.error);
      reject_fn(request.error);
    }

    function Get_Table(db, table_name, is_readonly = true)
    {
      const tx = db.transaction([table_name], is_readonly ? "readonly" : "readwrite");
      const store = tx.objectStore(table_name);
      return store;
    }

    async function Next_Id(db, table)
    {
      const data = await Get_Req_Res(table.getAll());
      const nextId = (data || []).reduce
        ((max, action) => Math.max(max, action.id || 0), 0) + 1;
      return nextId;
    }

    function Select_By_Id(db, table_name, id)
    {
      const table = Get_Table(db, table_name);
      const request = table.get(id);
      return Get_Req_Res(request);
    }

    function Insert(db, table_name, item)
    {
      return Insert_Items(db, table_name, [item]);
    }

    async function Insert_Items(db, table_name, items)
    {
      if (items && items.length > 0)
      {
        const table = Get_Table(db, table_name, false);
        for (const item of items)
        {
          if (item)
          {
            if (item.id == null || item.id == undefined)
              item.id = await Next_Id(db, table);
            const request = table.add(item);
            await Get_Req_Res(request);
          }
        }
      }
    }

    async function Update(db, table_name, new_item)
    {
      let res = null;

      const table = Get_Table(db, table_name, false);
      const existing_item = await Get_Req_Res(table.get(new_item.id));
      if (existing_item)
      {
        const combined_item = { ...existing_item, ...new_item };
        const request = table.put(combined_item);
        res = Get_Req_Res(request);
      }

      return res;
    }

    // business logic =================================================================

    // rendering ======================================================================

    function Set_Options(select_elem, items, value_field, text_field)
    {
      select_elem.innerHTML = '<option value="">None</option>';
      (items || []).forEach(item =>
      {
        const option = document.createElement("option");
        option.value = item[value_field];
        option.textContent = item[text_field];
        select_elem.appendChild(option);
      });
    }

    async function Render_Job_Items(db)
    {
      const jobs = await Get_Req_Res(Get_Table(db, "jobs").getAll()) || [];
      const agencies = await Get_Req_Res(Get_Table(db, "agencies").getAll());
      const contacts = await Get_Req_Res(Get_Table(db, "contacts").getAll());
      const actionLogs = await Get_Req_Res(Get_Table(db, "action_logs").getAll());

      const enrichedJobs = jobs.map(Add_Details);
      enrichedJobs.sort((a, b) => a.status_type - b.status_type);

      function Add_Details(job) 
      {
        const status_type = job_status.find(s => s.id === job.status)?.type;
        const latestLog = actionLogs
          .filter(log => log.job_id === job.id)
          .sort((a, b) => b.timestamp - a.timestamp || b.id - a.id)[0];
        const agency_name = agencies?.find(a => a.id === job.agency_id)?.name || "N/A";
        const contact_name = contacts?.find(c => c.id === job.contact_id)?.name || "N/A";
        const latest_note = latestLog?.note || "No notes available.";
        const latest_note_time_formatted = latestLog ? new Date(latestLog.timestamp).toLocaleString() : "";

        return {
          ...job,
          status_type,
          agency_name,
          contact_name,
          latest_note,
          latest_note_time_formatted
        };
      }

      jobs_list.value = enrichedJobs;
    }

    function On_Render_Job_Item(event, db)
    {
      const item_elem = event.target;
      const job = item_elem.item_obj;

      item_elem.role_title_elem.textContent = job.role_title;
      item_elem.role_type_elem.textContent = job.role_type;
      item_elem.location_elem.textContent = job.location;
      item_elem.remuneration_elem.textContent = job.remuneration;
      item_elem.remuneration_unit_elem.textContent = job.remuneration_unit;
      item_elem.agency_name_elem.textContent = job.agency_name;
      item_elem.contact_name_elem.textContent = job.contact_name;
      item_elem.latest_note_elem.textContent = job.latest_note;
      item_elem.latest_note_time_elem.textContent = job.latest_note_time_formatted;
      item_elem.add_note_btn.onclick = e => On_Click_Add_Note(e, job.id, db);
      item_elem.edit_job_btn.onclick = e => On_Click_Edit_Job(e, job.id, db);
      //item_elem.del_job_btn.onclick = e => On_Click_Delete_Job(e, job.id, db);

      if (job.status_type == 0 || job.status_type == undefined)
        item_elem.classList.remove("failed");
      else
        item_elem.classList.add("failed");
    }

    async function Render_Contacts(db)
    {
      const contacts = await Get_Req_Res(Get_Table(db, "contacts").getAll());
      const agencies = await Get_Req_Res(Get_Table(db, "agencies").getAll());

      const enrichedContacts = (contacts || []).map(contact => ({
        ...contact,
        agency_name: agencies?.find(a => a.id === contact.agency_id)?.name || "N/A"
      }));

      contacts_list.value = enrichedContacts;
    }

    function On_Render_Contact_Item(event, db)
    {
      const itemElem = event.target;
      const contact = itemElem.item_obj;

      itemElem.contact_name_elem.textContent = contact.name || "";
      itemElem.contact_phone_elem.textContent = contact.phone || "N/A";
      itemElem.contact_email_elem.textContent = contact.email || "N/A";
      itemElem.contact_agency_elem.textContent = contact.agency_name || "N/A";
      itemElem.contact_position_elem.textContent = contact.position || "N/A";
    }

  </script>

    <label slot="fields">Phone</label>
    <input slot="fields" type="tel" name="phone" placeholder="Contact phone">
    <label slot="fields">Position</label>
    <input slot="fields" type="text" name="position" placeholder="Contact position">
    <label slot="fields">Agency</label>
    <select id="contact_agency_select" slot="fields" name="agency_id"></select>

  <de-dialog-form id="email_dialog">
    <h1 slot="header">Extract Job from Email</h1>
    <label slot="fields">Paste Email Text</label>
    <textarea slot="fields" name="email_text" placeholder="Paste the job email content here..." rows="10"></textarea>
    <p slot="fields" style="font-size: 0.9em; color: #666;">AI will attempt to extract job details, contact info, and
      agency details from the email text.</p>
  </de-dialog-form>
